  // 늘 보이는 단추는 다섯까지(규칙 3) — 나머지는 「⋯」 안에. 계획 · 마무리는 때에 맞는 하나만 앞에 둔다(오후 세 시부터 마무리)
  const pmNow = new Date().getHours() >= 15;
  $('#daybar').classList.toggle('more-on', dayMore); $('#daybar').classList.add('dayb');
  $('#daybar').innerHTML =
      `<button data-go="-1" aria-label="전날">‹</button>
       <h1>${day===T ? '오늘' : dOnly(day)}</h1>
       <span class="wd">${dOnly(day)} ${weekday(day)}${DB.holiday(day) ? ` · <span class="hol">${DB.holiday(day)}</span>` : DB.jeolgi(day) ? ` · ${DB.jeolgi(day)}` : ''}</span>
       <button data-go="1" aria-label="다음 날">›</button>
       ${day!==T ? `<button class="today" data-go="0">오늘로</button>` : ''}
       ${day === T ? `<button class="today ${pmNow ? 'xtra' : ''}" data-flow="am" title="아침 계획 — 남은 일과 날짜 없는 일에서 오늘 할 것 고르기">계획</button><button class="today ${pmNow ? '' : 'xtra'}" data-flow="pm" title="저녁 마무리 — 오늘 한 것 · 남은 것 · 한 줄">마무리</button>` : ''}
       ${dayMode !== 'quad' ? `<button class="today xtra qx" data-daymode="quad" title="중요 · 급함 4칸으로 나눠 보기">4칸</button>` : ''}
       <span class="seg dseg ${dayMode === 'quad' ? 'q' : ''}"><button data-daymode="list" class="${dayMode === 'list' ? 'on' : ''}" title="할 일 목록으로">목록</button><button data-daymode="quad" class="${dayMode === 'quad' ? 'on' : ''}" title="중요 · 급함 4칸으로 나눠 보기">4칸</button><button data-daymode="time" class="${dayMode === 'time' ? 'on' : ''}" title="그날 하루를 시간 띠로">시간 띠</button></span>
       ${DB.todosOn(day).length ? `<button class="today xtra" data-daycopy title="이 날의 할 일을 다른 날에도">이 날 복사</button>` : ''}
       <button class="today xtra" data-pickon title="여러 개를 골라 한꺼번에 옮기기 · 끝내기 · 지우기">고르기</button>
       <button class="dmore" data-daymore title="${dayMore ? '접기' : '더 — ' + (dayMode !== 'quad' ? '4칸 · ' : '') + (day === T ? (pmNow ? '계획' : '마무리') + ' · ' : '') + (DB.todosOn(day).length ? '이 날 복사 · ' : '') + '고르기'}" aria-label="더 보기">⋯</button>`;
}

function row(t){
  const l = t.listId ? DB.listOf(t.listId) : null;
  const T = DB.today();
  const m = mode(), inLog = m === 'log';
  const showDate = !inLog && (m !== 'day' || !t.date || t.date !== day);
  const opts = DB.lists().filter(x => !x.done || (l && x.id === l.id));
  const hasNote = !!(t.note && t.note.trim()), noteOn = openNotes.has(t.id);
  const subs = DB.subsOf(t), subOn = openSubs.has(t.id), subDone = subs.filter(x => x.done).length;
  // 잡은 길이(dur) — 재기 전엔 시각 칩에 「오후 2시 · 1시간 30분」, 재고 나면 「50분 / 1시간 30분」(채점 11판 K2 — Sunsama처럼 할 일마다 계획 · 실제)
  const play = !t.done && !t.run && !inLog && !!l && (m === 'day' || m === 'goal');   // 목표의 일은 「시작」을 늘 보이게 — 정한 곳 / 그 밖을 만드는 단추(규칙 10). 줄 도구에서는 뺀다(규칙 3)
  const r = t.repeat, rb = new Date((t.date || T) + 'T00:00:00');
  const repSel = `<span class="rep"><button tabindex="-1">반복</button><select data-do="setrepeat" title="반복">
      <option value="" ${!r?'selected':''}>반복 안 함</option>
      <option value="day" ${r&&r.every==='day'?'selected':''}>매일</option>
      <option value="weekday" ${r&&r.every==='weekday'?'selected':''}>평일마다 (월~금)</option>
      <option value="week" ${r&&r.every==='week'&&!r.n?'selected':''}>매주 ${WD[rb.getDay()]}요일</option>
      <option value="week2" ${r&&r.every==='week'&&r.n===2?'selected':''}>격주 ${WD[rb.getDay()]}요일</option>
      ${r&&r.every==='week'&&r.n>2 ? `<option value="" disabled selected>${repText(r)}</option>` : ''}
      <option value="month" ${r&&r.every==='month'?'selected':''}>매달 ${rb.getDate()}일</option>
      <option value="year" ${r&&r.every==='year'?'selected':''}>매년 ${r&&r.every==='year' ? r.mon + '월 ' + r.dom : rb.getMonth() + 1 + '월 ' + rb.getDate()}일</option>
      <option value="days" ${r&&r.every==='days'?'selected':''}>${r&&r.every==='days' ? r.n + '일마다' : '며칠마다…'}</option>
      <option value="times" ${r&&r.every==='times'?'selected':''}>${r&&r.every==='times' ? '주 ' + r.n + '회' : '주 몇 회…'}</option>
      ${r ? `<option value="${r.paused ? 'resume' : 'pause'}">${r.paused ? '다시 하기' : '잠시 멈춤'}</option>` : ''}</select></span>`;
  return `<li class="row ${t.done?'done':''} ${toolsOn === t.id ? 'tools-on' : ''} ${toolsMore === t.id ? 'tools-more' : ''} ${picked.has(t.id) ? 'picked' : ''}" data-t="${esc(t.id)}" tabindex="-1">
    ${picking ? `<span class="pk"></span>` : ''}
    ${m === 'day' || m === 'goal' ? `<span class="grip" draggable="true" title="끌어서 순서 바꾸기">⋮⋮</span>` : ''}
    <span class="ck ${t.done?'on':''}" data-do="toggle" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.text)}"></span>
    <span class="tx" data-do="edit">${esc(t.text)}</span>
    <span class="meta">
      <span class="tools">
        ${t.run ? `<button class="q" data-do="stop">멈춤</button>` : !t.done && !inLog && !play ? `<button class="q" data-do="start" title="시간 재기">시작</button>` : ''}
        ${!inLog && t.date ? `<button class="q" data-do="tomorrow">${t.date > T ? '하루 뒤로' : '내일로'}</button>` : ''}
        ${!inLog && t.date !== T ? `<button class="q" data-do="toToday">오늘로</button>` : ''}
        ${!inLog && !t.done ? repSel : ''}
        ${!inLog && !t.done ? (t.time ? `<button class="q" data-do="cleartime">시각 빼기</button>` : `<button class="q" data-do="timepick">시각</button>`) : ''}
        ${!hasNote ? `<button class="q" data-do="note">메모</button>` : ''}
        ${!subs.length && !inLog ? `<button data-do="subs" title="잘게 나눠 적기">하위 할 일</button>` : ''}
        <button class="q" data-do="del">지움</button>
        ${!inLog && r && !t.done ? `<button class="xtra" data-do="skip" title="끝낸 것으로 세지 않고 다음 날로">건너뛰기</button>` : ''}
        ${!inLog && r && !t.done && !t.run ? `<button class="xtra" data-do="detach" title="이번 것만 따로 떼어 고칩니다 — 반복은 다음 날부터 그대로">이번만 따로</button>` : ''}
        ${!inLog && !t.done && t.date && !r ? (t.endDate ? `<button class="xtra" data-do="clearend">기간 빼기</button>` : `<button class="xtra" data-do="endpick" title="며칠에 걸친 일 — 끝나는 날 고르기">기간</button>`) : ''}
        ${!inLog && !t.done ? (t.deadline ? `<button class="xtra" data-do="cleardl">마감 빼기</button>` : `<button class="xtra" data-do="dlpick" title="언제까지 — 할 날과 따로">마감</button>`) : ''}
        ${!inLog ? `<button class="xtra" data-do="copy" title="같은 일을 다른 날에도">복사</button>` : ''}
        ${!inLog && !t.done ? (t.goal ? `<button class="xtra" data-do="countdown" title="하나 빼기">한 번 빼기</button><button class="xtra" data-do="nogoal">세기 빼기</button>` : `<button class="xtra" data-do="setgoal" title="물 8잔처럼 하루에 여러 번">세기</button>`) : ''}
      </span>
      ${play ? `<button class="play" data-do="start" title="시간 재기 — 정한 곳에 쌓입니다" aria-label="시간 재기 · ${esc(t.text)}">▶</button>` : ''}
      <button class="more" data-do="more" aria-label="도구 펼치기" title="이 할 일의 도구 전부 — 반복 · 기간 · 마감 · 복사 · 세기 …">⋯</button>
      ${t.run ? `<span class="d run" data-run="${esc(t.id)}">● ${fmtClock(DB.runSecs(t))}</span>`
        : DB.totalSecs(t) ? `<span class="d" title="${DB.plannedSecs(t) ? '쓴 시간 — ≈ 는 시간표로 적은 몫이 들어 있다는 뜻' : '쓴 시간'}${t.dur ? ' / 잡은 길이' : ''}">${DB.plannedSecs(t) ? '≈' : ''}${fmtDur(DB.totalSecs(t))}${t.dur ? ` / ${fmtDur(t.dur * 60)}` : ''}</span>` : ''}
      <input type="time" class="tpick" data-do="settime" value="${t.time || ''}" tabindex="-1" aria-hidden="true">
      ${t.date ? `<input type="date" class="epick" data-do="setend" value="${t.endDate || ''}" min="${DB.shift(t.date, 1)}" tabindex="-1" aria-hidden="true">` : ''}
      <input type="date" class="epick dpick" data-do="setdl" value="${t.deadline || ''}" tabindex="-1" aria-hidden="true">
      ${t.deadline && !t.done && !inLog ? `<span class="d nm-mark dl ${ddays(t.deadline) <= 1 ? 'near' : ''}" data-do="dlpick" title="마감 고치기">${dOnly(t.deadline)}까지 · ${ddText(t.deadline)}</span>` : ''}
      ${t.time ? `<span class="d tm" data-do="timepick" title="시각 고치기">${fmtTime(t.time)}${t.dur && !DB.totalSecs(t) && !t.run ? ` · ${fmtDur(t.dur * 60)}` : ''}</span>` : ''}
      ${hasNote ? `<span class="d nm-mark" data-do="note" title="메모 ${noteOn ? '접기' : '펼치기'}">메모</span>` : ''}
      ${subs.length ? `<span class="d nm-mark" data-do="subs" title="하위 할 일 ${subOn ? '접기' : '펼치기'}">하위 ${subDone}/${subs.length}</span>` : ''}
      ${t.goal && !inLog ? `<button class="tallyb ${t.done ? 'full' : ''}" data-do="countup" title="한 번 더">${(t.tally || {})[t.date || DB.today()] || 0}/${t.goal}</button>` : ''}
      ${r && !inLog && r.every === 'times' && !r.paused ? weekGrid(t) : ''}
      ${r && !inLog ? `<span class="d">↻ ${repText(r)}${r.paused ? ' · 멈춤' : timesGot(r)}</span>` : ''}
      ${t.endDate && !inLog ? `<span class="d nm-mark" data-do="endpick" title="끝나는 날 고치기">${dOnly(t.date)}~${dOnly(t.endDate)}</span>`
        : inLog ? (l ? `<span class="d">${esc(l.name)}</span>` : '')
        : showDate ? `<span class="d">${t.date?dOnly(t.date):'날짜 없음'}</span>`
        : (t.movedFrom && t.movedFrom !== t.date ? `<span class="d">${dOnly(t.movedFrom)}부터</span>` : '')}
      <span class="cdot ${l?'':'none'}" style="${l?`background:${l.color}`:''}" title="목표">
        <select data-do="setlist">
          <option value="" ${!l?'selected':''}>목표 없음</option>
          ${opts.map(x=>`<option value="${esc(x.id)}" ${l&&l.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
        </select></span>
    </span>
    ${noteOn ? `<div class="memo"><textarea data-note="${esc(t.id)}" rows="2" placeholder="메모 — 적는 대로 저장됩니다">${esc(t.note)}</textarea></div>` : ''}
    ${subOn ? `<div class="subs">${subs.map(x => `<div class="sub ${x.done ? 'done' : ''}" data-sub="${esc(x.id)}">
        <span class="ck ${x.done ? 'on' : ''}" data-subdo="toggle"></span><span class="stx" data-subdo="edit">${esc(x.text)}</span>
        <button class="sx" data-subdo="del" title="지우기">×</button></div>`).join('')}
      <button class="addrow sadd" data-subdo="add" data-again="sub-${esc(t.id)}">+ 하위 할 일</button></div>` : ''}
    ${copyFor === t.id ? copyPanel(t.id, t.date) : ''}</li>`;
}

function rows(ts){                              // 안 끝낸 것만 펴 두고 끝낸 것은 한 줄로 접는다
  const a = ts.filter(t => !t.done), d = ts.filter(t => t.done);
  return `<ul>${a.map(row).join('')}${showDone ? d.map(row).join('') : ''}</ul>`
    + (d.length ? `<button class="fold" data-fold>${showDone ? '끝낸 것 접기' : '끝낸 것 ' + d.length}</button>` : '');
}

function group(ts, fold){
  if (!ts.length) return '';
  const by = new Map();
  ts.forEach(t => { const k = t.listId || ''; (by.get(k) || by.set(k,[]).get(k)).push(t); });
  let out = '';
  for (const [k, arr] of by){
    const l = k ? DB.listOf(k) : null;
    out += `<div class="box">
      <h2 ${l ? `class="gh" style="--gc:${l.color}" data-list="${esc(l.id)}" title="목표 화면 열기"` : ''}>${l
          ? `<span class="gdot" style="background:${l.color}"></span>${esc(l.name)}` : '목표 없음'}${fold ? cnt(arr) : ' · ' + arr.length}</h2>
      ${fold ? rows(arr) : `<ul>${arr.map(row).join('')}</ul>`}</div>`;
  }
  return out;
}

function goalPage(l){
  const ss = DB.stagesOf(l), cur = DB.nowStage(l);
  const stage = s => { const isNow = cur && cur.id === s.id;
    return `<li class="row stage ${s.done?'done':''} ${isNow?'cur':''}" data-s="${esc(s.id)}">
      <span class="ck ${s.done?'on':''}" data-sdo="toggle"></span>
      <span class="tx" data-sdo="edit">${esc(s.name)}</span>
      <span class="meta"><span class="tools">
          ${!s.done && !isNow ? `<button data-sdo="cur">지금으로</button>` : ''}
          <button data-sdo="del">지움</button></span>
        ${isNow ? `<span class="now">지금</span>` : ''}</span></li>`; };
  const ts = DB.todos().filter(t => t.listId === l.id)
               .sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || DB.byWhen(a, b));   // 날짜 순(없는 것은 끝), 같은 날은 정한 순서
  return `<div class="box"><h2>단계${ss.length ? ' · ' + ss.length : ''}</h2>
      <ul>${ss.map(stage).join('')}</ul>
      <button class="addrow" data-lact="addstage">+ 단계</button></div>
    <div class="box"><h2>할 일${cnt(ts)}</h2>${rows(ts)}
      <button class="addrow" data-lact="addtodo">+ 할 일</button></div>
    <div class="box memo-box"><h2>메모</h2><textarea data-goalmemo="${esc(l.id)}" rows="2" placeholder="왜 이 목표인가 · 어떻게 할까 · 참고할 것 — 적는 대로 저장됩니다">${esc(l.note || '')}</textarea></div>
    <div class="gact">${l.done ? `<button data-lact="reopen">다시 열기</button>` : `<button data-lact="finish">목표 마치기</button>`}
      <button data-lact="del" title="목표만 지웁니다 — 할 일은 「목표 없음」으로 남습니다">지우기</button>${(n => n
        ? `<button data-lact="delall" title="끝낸 일은 기록으로 남깁니다">안 끝낸 할 일까지 지우기 · ${n}</button>` : '')(ts.filter(t => !t.done).length)}</div>`;
}

function timeLine(o){                          // 「정한 곳 · 그 밖」 — 막대는 날마다 같은 폭. 두 몫의 비율만 보인다 (% 숫자는 안 쓴다)
  if (!o || !(o.on + o.off)) return '';
  return `<div class="ltime"><span><i class="k on"></i>정한 곳 ${fmtDur(o.on)}</span><span><i class="k off"></i>그 밖 ${fmtDur(o.off)}</span>${o.plan
      ? `<span class="lplan" title="시간표에 놓고 끝낸 일 — 타이머로 재지 않아 칸 길이로 적었습니다">그중 시간표로 ${fmtDur(o.plan)}</span>` : ''}</div>
    <div class="split" title="정한 곳 ${fmtDur(o.on)} · 그 밖 ${fmtDur(o.off)}"><i style="flex:${o.on}"></i><b style="flex:${o.off}"></b></div>`;
}

function timeHero(o){                          // 한 주의 주인공 — 정한 곳 / 그 밖을 큰 숫자로. % 없이 두 몫만
  if (!o || !(o.on + o.off)) return '';
  return `<div class="whero"><div><span><i class="k on"></i>정한 곳</span><b>${fmtDur(o.on)}</b></div><div><span><i class="k off"></i>그 밖</span><b>${fmtDur(o.off)}</b></div></div>
    <div class="split big" title="정한 곳 ${fmtDur(o.on)} · 그 밖 ${fmtDur(o.off)}"><i style="flex:${o.on}"></i><b style="flex:${o.off}"></b></div>${o.plan
      ? `<div class="ltime"><span class="lplan" title="시간표에 놓고 끝낸 일 — 타이머로 재지 않아 칸 길이로 적었습니다">그중 시간표로 ${fmtDur(o.plan)}</span></div>` : ''}`;
}

function logPage(){                            // 날마다 한 줄 — 끝낸 것과 쓴 시간. 점수·비교 없이
  const T = DB.today(), done = new Map(), work = new Map(), unknown = [], tb = DB.timeByDay();
  const put = (m, d, t) => (m.get(d) || m.set(d, []).get(d)).push(t);
  DB.todos().forEach(t => {
    if (t.done){ if (t.doneAt) put(done, t.doneAt, t); else unknown.push(t); }
    const ds = new Set([...Object.keys(t.spent || {}), ...Object.keys(t.planned || {})]); if (t.run) ds.add(T);
    ds.forEach(d => { if (!(t.done && t.doneAt === d)) put(work, d, t); });   // 그날 시간만 쓴 것
  });
  const days = [...new Set([...done.keys(), ...Object.keys(tb), ...DB.linedDays()])].sort().reverse();
  if (!days.length && !unknown.length)
    return `<div class="box"><div class="empty">아직 기록이 없습니다. 할 일을 체크하거나 시간을 재면 그날 날짜로 여기 남습니다.</div></div>`;
  if (!openDays) openDays = new Set(days.slice(0, 1));
  const dayBlock = (key, label, dn, wk, tm) => { const on = openDays.has(key);
    return `<div class="lday"><button class="logday" data-logday="${key}">
        <span>${label}</span>${dn.length ? `<span class="n">· 끝낸 것 ${dn.length}</span>` : ''}<span class="car">${on ? '접기' : '보기'}</span></button>
      ${timeLine(tm)}${key !== '?' && DB.dayLine(key) ? `<div class="lline">「${esc(DB.dayLine(key))}」</div>` : ''}
      ${on ? `<ul>${dn.map(row).join('')}</ul>${wk.length ? `<div class="lsub">시간을 쓴 것</div><ul>${wk.map(row).join('')}</ul>` : ''}` : ''}</div>`; };
  let html = days.slice(0, logMore)
    .map(d => dayBlock(d, (d === T ? '오늘 · ' : '') + dOnly(d) + ' ' + weekday(d), done.get(d) || [], work.get(d) || [], tb[d])).join('');
  if (days.length <= logMore && unknown.length) html += dayBlock('?', '끝낸 날을 모름', unknown, [], null);
  html = `<div class="box log">${html}</div>`;
  if (days.length > logMore)
    html += `<button class="addrow" data-logmore>더 보기 · 남은 날 ${days.length - logMore}</button>`;
  return html;
}

/* ── 한 주를 대신 읽기 ── 규칙으로 쓴 문장. 밖으로 보내지 않는다. % · 점수 없이 「정한 것과 한 것」만.
   조사(나 · 이 · 을)는 시간 뒤에만 붙는다 — 「분」「시간」 모두 받침이 있어 「이 · 을 · 으로」로 고정 */
function readWeek(wk){
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => DB.shift(wk, i)), inWk = d => d && d >= days[0] && d <= days[6];
  const plan = new Map(), got = new Map(), name = k => k ? DB.listOf(k).name : '';
  let on = 0, off = 0;
  DB.todos().forEach(t => { const k = t.listId && DB.listOf(t.listId) && !DB.listOf(t.listId).deletedAt ? t.listId : '';
    if (inWk(t.date) && t.time) plan.set(k, (plan.get(k) || 0) + DB.blockMin(t) * 60);
    const s = days.reduce((a, d) => a + DB.secsOn(t, d), 0);
    if (s){ got.set(k, (got.get(k) || 0) + s); if (k) on += s; else off += s; } });
  const moved = DB.todos().filter(t => !t.done && inWk(t.date) && t.movedCount >= 2).sort((a, b) => b.movedCount - a.movedCount)[0];
  const movedLine = moved ? `여러 번 옮긴 일 — 「${moved.text}」 ${moved.movedCount}번. 할 시각을 정해 두거나, 쪼개거나, 이 주는 내려놔도 됩니다.` : '';   // 시각 — 실행 의도(조사.md 2장 ③ · 94개 연구). 「미루는 건 언제 할지를 안 정해서」(인스타 플래너 저장, 09-26)
  if (!on && !off && !plan.size)                 // 잰 시간이 없어도 자꾸 미룬 일은 읽어 준다(09-26)
    return ['이 주에는 시간표도 잰 시간도 없습니다. 시간표에 한 칸을 놓거나 목표의 일 옆 ▶를 누르면, 다음에는 여기서 읽어 드립니다.'].concat(movedLine ? [movedLine] : []);
  const out = [];
  if (on + off) out.push(`이 주에 쓴 시간 ${fmtDur(on + off)} 가운데 정한 곳이 ${fmtDur(on)}, 그 밖이 ${fmtDur(off)}입니다.`);
  [...plan.entries()].filter(([k]) => k).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([k, p]) => {   // 잡아 둔 시간이 큰 목표부터 둘 — 사람이 아니라 계획을 읽는 차례
    const g = got.get(k) || 0;
    out.push(g >= p * 0.9 ? `「${name(k)}」에는 잡아 둔 ${fmtDur(p)}만큼 썼습니다.`
      : `「${name(k)}」에 ${fmtDur(p)}을 잡아 두었고, 쓴 시간은 ${g ? fmtDur(g) + '입니다' : '아직 없습니다'}.`); });
  const extra = [...got.entries()].filter(([k, g]) => !plan.has(k) && g >= 1800).sort((a, b) => b[1] - a[1])[0];
  if (extra) out.push(`시간표에 없던 ${extra[0] ? '「' + name(extra[0]) + '」' : '목표 없는 일'}에 ${fmtDur(extra[1])}이 갔습니다.`);
  if (movedLine) out.push(movedLine);
  return out.slice(0, 4);
}

function weekPage(){                           // 한 주 — 끝낸 것과 쓴 시간을 목표별로, 그리고 세 칸. 점수·달성률 없이
  const wk = weekStart, days = [0, 1, 2, 3, 4, 5, 6].map(i => DB.shift(wk, i)), inWk = d => d && d >= wk && d <= days[6];
  const tb = DB.timeByDay(), sum = { on:0, off:0 }, per = new Map();
  days.forEach(d => { if (tb[d]){ sum.on += tb[d].on; sum.off += tb[d].off; } });
  const get = k => per.get(k) || per.set(k, { done:[], secs:0 }).get(k);
  DB.todos().forEach(t => { const k = t.listId && DB.listOf(t.listId) ? t.listId : '';
    if (t.done && inWk(t.doneAt)) get(k).done.push(t);
    const s = days.reduce((a, d) => a + DB.secsOn(t, d), 0); if (s) get(k).secs += s; });
  const nDone = [...per.values()].reduce((a, p) => a + p.done.length, 0);
  const order = DB.lists().map(l => l.id).filter(id => per.has(id)).concat(per.has('') ? [''] : []);   // 옆 칸 차례 — 많이 한 순으로 줄 세우지 않는다
  const groups = order.map(k => { const l = k ? DB.listOf(k) : null, p = per.get(k);
    const bits = [p.done.length ? '끝낸 것 ' + p.done.length : '', p.secs ? fmtDur(p.secs) : ''].filter(Boolean).join(' · ');
    return `<div class="wg"><div class="wh" ${l ? `data-list="${esc(l.id)}" title="목표 화면 열기"` : ''}>${l
        ? `<span class="gdot" style="background:${l.color}"></span>${esc(l.name)}` : '목표 없음'}<span class="n">${bits}</span></div>
      ${p.done.length ? `<div class="wl">${p.done.map(t => esc(t.text)).join(' · ')}</div>` : ''}</div>`; }).join('');
  const opn = w => [0, 1, 2, 3, 4, 5, 6].reduce((a, i) => a + DB.opensOn(DB.shift(w, i)), 0), oNow = opn(wk), oPrev = opn(DB.shift(wk, -7));
  const opens = oNow || oPrev ? `<div class="opn" title="이 기기 안에서만 셉니다 — 밖으로 보내지 않습니다. 5분 넘게 떠나 있다가 돌아온 것을 한 번으로 셉니다">이 주에 ${oNow}번 열었습니다 · 앞 주 ${oPrev}번</div>` : '';
  const rv = DB.review(wk), prev = DB.review(DB.shift(wk, -7)), hero = timeHero(sum);
  const field = (f, label, ph) => `<label class="rv"><span>${label}</span>
      <textarea data-rev="${f}" data-week="${wk}" rows="2" placeholder="${ph}">${esc(rv[f])}</textarea></label>`;
  return (cardOn ? cardPanel(wk) : '') + (prev.next.trim() ? `<div class="carry wnext">지난주에 정한 한 가지 — 「${esc(prev.next.trim())}」</div>` : '')
    + `<div class="box read"><h2>한 주를 읽어 드립니다</h2>${hero}${readWeek(wk).filter(s => !(hero && s.startsWith('이 주에 쓴 시간'))).map(s => `<p>${esc(s)}</p>`).join('')}
        <div class="rnote">규칙으로 쓴 문장입니다 — 기기 밖으로 보내지 않습니다</div></div>`
    + `<div class="box"><h2>한 주${nDone ? ' · 끝낸 것 ' + nDone : ''}</h2>${opens}
        ${groups ? `<div class="wlist">${groups}</div>` : `<div class="empty">이 주에는 끝낸 것도 잰 시간도 ${days[6] < DB.today() ? '' : '아직 '}없습니다.</div>`}</div>`
    + `<div class="box"><h2>돌아보기</h2>${field('good', '잘 된 것', '이번 주에 잘 된 것 하나')}${field('stuck', '걸린 것', '무엇이 막았나 — 탓이 아니라 사실로')}${field('next', '다음 주 한 가지', '다음 주에 하나만 한다면')}</div>`;
}

/* ── 시간표 ── 한 주를 시간 칸으로. 시각 있는 일은 블록, 시각 없는 일은 위 줄, 날짜 없는 일은 맨 위 줄.
   끌어서 놓고, 아래 모서리로 길이. 15분 단위. 6시 전은 맨 위에 붙인다 */
const H0 = 6, H1 = 24, PX = 44 / 60;           // 한 시간 44px
function calTimePage(days = [0, 1, 2, 3, 4, 5, 6].map(i => DB.shift(calWeek, i))){   // 하루만 주면 오늘 화면의 「시간」
  const T = DB.today();
  const timed = new Map(), untimed = new Map(), put = (m, k, v) => (m.get(k) || m.set(k, []).get(k)).push(v);
  DB.todos().forEach(t => { if (!t.date || (t.endDate || t.date) < days[0] || t.date > days[6]) return;
    if (t.time) put(timed, t.date, t);
    else if (!t.done) spanDays(t).forEach(d => { if (d >= days[0] && d <= days[6]) put(untimed, d, t); }); });   // 여러 날 것은 날마다
  const inbox = DB.undated().filter(t => !t.done).sort(DB.byPos);
  // ▶로 잰 구간 — 날마다 잘라 오른쪽 줄에 놓는다. 잡은 칸(왼쪽)과 나란히 보면 어디서 어긋났는지 보인다(채점 11판 K2, Sync: Plan & Actual)
  const acts = new Map(), nowS = Math.floor(Date.now() / 1000);
  DB.todos().forEach(t => { const g = [...(t.segs || []), ...(t.run ? [[Math.floor(Date.parse(t.run) / 1000), nowS]] : [])];
    g.forEach(([a, b]) => days.forEach(d => { const d0 = Date.parse(d + 'T00:00:00') / 1000, x = Math.max(a, d0), y = Math.min(b, d0 + 86400);
      if (y - x >= 60) put(acts, d, { t, s:(x - d0) / 60, e:(y - d0) / 60, live:!!t.run && b === nowS }); })); });
  const act = [...acts.values()].some(a => a.length), R = act ? 'var(--actw)' : '0px';
  const hm = m => fmtTime(String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0'));
  const chip = t => `<div class="tchip" data-tchip="${esc(t.id)}" data-t="${esc(t.id)}" title="시간 칸으로 끌어 놓기">
      <span class="ck" data-do="toggle"></span><span>${esc(t.text)}</span></div>`;
  const col = d => {
    const pos = [];                             // 겹치면 옆으로 — 서로 겹치는 것끼리만 묶어서 그 묶음 안에서만 나눈다
    let lanes = [], grp = [], grpEnd = -1;     // 안 겹치는 블록은 제 폭을 다 쓴다
    const close = () => { const n = Math.max(1, lanes.length); grp.forEach(p => { p.n = n; pos.push(p); }); lanes = []; grp = []; };
    (timed.get(d) || []).sort(DB.byWhen).forEach(t => {
      const s = toMin(t.time), e = s + (t.dur || 60);
      if (grp.length && s >= grpEnd){ close(); grpEnd = -1; }
      let k = lanes.findIndex(end => end <= s); if (k < 0){ k = lanes.length; lanes.push(e); } else lanes[k] = e;
      grp.push({ t, s, e, k }); grpEnd = Math.max(grpEnd, e); });
    close();
    const blocks = pos.map(({ t, s, e, k, n }) => { const l = t.listId && DB.listOf(t.listId);
      const top = Math.max(0, (s - H0 * 60) * PX), h = Math.max(18, (Math.min(e, H1 * 60) - Math.max(s, H0 * 60)) * PX);
      return `<div class="tb ${t.done ? 'done' : ''}" data-tb="${esc(t.id)}" data-t="${esc(t.id)}"
          style="top:${top}px;height:${h}px;left:calc((100% - ${R}) * ${k / n} + 2px);width:calc((100% - ${R}) / ${n} - 4px);--bc:${l ? l.color : 'var(--c4)'}">
        <span class="ck ${t.done ? 'on' : ''}" data-do="toggle"></span><span class="tbt"><b>${t.time}</b>${esc(t.text)}</span>
        <span class="tb-rs" data-rs="${esc(t.id)}" title="끌어서 길이 바꾸기"></span></div>`; }).join('');
    const done = (acts.get(d) || []).map(({ t, s, e, live }) => { const l = t.listId && DB.listOf(t.listId);
      const top = Math.max(0, (s - H0 * 60) * PX), h = Math.max(6, (Math.min(e, H1 * 60) - Math.max(s, H0 * 60)) * PX);
      return `<div class="ta" style="top:${top}px;height:${h}px;--bc:${l ? l.color : 'var(--c5)'}" title="▶로 잰 시간 · ${hm(s)}~${live ? '지금' : hm(e)} · ${fmtDur((e - s) * 60)} · ${esc(t.text)}">${h >= 16 ? `<span>${esc(t.text)}</span>` : ''}</div>`; }).join('');
    const x = new Date(), nm = x.getHours() * 60 + x.getMinutes();
    const now = d === T && nm >= H0 * 60 ? `<div class="tt-now" style="top:${(nm - H0 * 60) * PX}px"></div>` : '';
    return `<div class="ttc ${d === T ? 'tdy' : ''}" data-tcol="${d}">${blocks}${done}${now}</div>`; };
  const hours = Array.from({ length: H1 - H0 }, (_, i) => `<span style="top:${i * 60 * PX}px">${H0 + i}</span>`).join('');
  return `<div class="tt ${days.length === 1 ? 'one' : ''}">
    <div class="tt-tray" data-ttray><span class="tt-lab">날짜 없는 일</span>${inbox.slice(0, 40).map(chip).join('')
      || '<span class="tt-empty">없음 — 칸에서 여기로 끌어 오면 날짜가 빠집니다</span>'}${act ? '<span class="tt-leg"><i></i>잡은 시간 · <i class="a"></i>▶로 잰 시간(오른쪽 줄)</span>' : ''}</div>
    <div class="tt-grid tt-top"><span></span>${days.map(d => `<div class="tth ${d === T ? 'tdy' : ''} ${redCls(d)}" data-cal="${d}" title="그날 화면 열기">
        <span>${WD[new Date(d + 'T00:00:00').getDay()]}</span><b>${+d.slice(8)}</b>${holiName(d)}</div>`).join('')}
      <span class="tt-gut">시각<br>없음</span>${days.map(d => `<div class="tts" data-tstrip="${d}">${(untimed.get(d) || []).sort(DB.byPos).map(chip).join('')}</div>`).join('')}</div>
    <div class="tt-grid tt-body"><div class="tt-hours">${hours}</div>${days.map(col).join('')}</div></div>`;
}

/* ── 4칸 ── 중요 × 급함. LockDay(차트 10위)의 중심 · 아이젠하워 매트릭스(17위) · Taska(45위) — 09-26 채점 11판에 넣었다.
   09-22에 「적을 때마다 묻는다」로 뺐던 것이라, 적을 때는 안 묻는다. 안 나눈 일은 아래에 두고 눌러서 놓는다 */
const QUADS = [[1, '먼저', '중요 · 급함'], [2, '날 잡기', '중요 · 안 급함'], [3, '짧게', '급함 · 덜 중요'], [4, '나중에', '둘 다 아님']];
function quadPage(d){                         // 오늘은 지난 일 · 날짜 없는 일(언젠가)까지 — 1위 앱의 4칸은 남은 일 전부를 나눈다(LockDay 「중요 · 긴급 · 언젠가」)
  const T = DB.today(), more = d === T ? [...DB.past(), ...DB.undated().filter(t => !t.done)] : [];
  const ts = [...DB.todosOn(d).sort(DB.byPos), ...more], by = q => ts.filter(t => (t.q || 0) === q);
  const when = t => t.date === d ? '' : `<span class="qw">${t.date ? dOnly(t.date) + '부터' : '날짜 없음'}</span>`;
  const item = t => { const l = t.listId && DB.listOf(t.listId);
    return `<div class="qi ${t.done ? 'done' : ''}" data-t="${esc(t.id)}" draggable="true">
      <span class="ck ${t.done ? 'on' : ''}" data-do="toggle"></span>
      <button class="qt" data-do="quadpick" title="어느 칸에 놓을지 고르기">${l ? `<span class="gdot" style="background:${l.color}"></span>` : ''}${esc(t.text)}${when(t)}</button>
      ${quadPick === t.id ? `<span class="qpk">${QUADS.filter(([q]) => q !== t.q).map(([q, n]) => `<button data-do="quad" data-q="${q}">${n}</button>`).join('')}${t.q ? '<button data-do="quad" data-q="0">빼기</button>' : ''}</span>` : ''}</div>`; };
  const box = ([q, n, sub]) => `<div class="qb q${q}" data-qbox="${q}"><div class="qh"><b>${n}</b><span>${sub}</span></div>
      ${by(q).map(item).join('') || '<div class="qe">할 일을 누르면 이 칸에 놓을 수 있습니다</div>'}</div>`;
  const rest = by(0);
  return `<div class="quad">${QUADS.map(box).join('')}</div>`
    + `<div class="box qrest" data-qbox="0"><h2>아직 안 나눈 일 · ${rest.length}</h2>${rest.map(item).join('') || '<div class="empty">다 나눴습니다.</div>'}</div>`;
}

function calWeekPage(){                        // 주 보기 — 이레 칸. 카드를 끌어 다른 날로, 칸 아래에서 바로 적기
  const T = DB.today(), days = [0, 1, 2, 3, 4, 5, 6].map(i => DB.shift(calWeek, i));
  const by = new Map(), dues = new Map(), put = (m, k, v) => (m.get(k) || m.set(k, []).get(k)).push(v);
  DB.todos().forEach(t => { if (t.date) spanDays(t).forEach(d => { if (d >= days[0] && d <= days[6]) put(by, d, t); }); });   // 여러 날 것은 날마다
  DB.lists().forEach(l => { if (l.due && !l.done) put(dues, l.due, l); });
  DB.todos().forEach(t => { if (t.deadline && !t.done) put(dues, t.deadline, { name:t.text, color:t.listId && DB.listOf(t.listId) ? DB.listOf(t.listId).color : 'var(--c4)' }); });   // 할 일의 마감도
  const card = t => { const l = t.listId && DB.listOf(t.listId);
    return `<div class="wcard ${t.done ? 'done' : ''}" draggable="true" data-wcard="${esc(t.id)}" data-t="${esc(t.id)}">
      <span class="ck ${t.done ? 'on' : ''}" data-do="toggle"></span>
      <span class="wt" data-cal="${t.date}" title="그날 화면 열기">${t.time ? `<b class="ct">${t.time}</b>` : ''}${esc(t.text)}</span>
      ${l ? `<span class="gdot" style="background:${l.color}"></span>` : ''}</div>`; };
  return `<div class="wk">${days.map(d => { const ts = (by.get(d) || []).sort((a, b) => a.done - b.done || DB.byWhen(a, b));
    return `<div class="wc ${d === T ? 'tdy' : ''} ${d < T ? 'past' : ''}" data-wcol="${d}">
      <div class="wch ${redCls(d)}" data-cal="${d}" title="그날 화면 열기"><span>${WD[new Date(d + 'T00:00:00').getDay()]}</span><b>${+d.slice(8)}</b>${holiName(d)}</div>
      ${(dues.get(d) || []).map(l => `<div class="wdue"><span class="gdot" style="background:${l.color}"></span>마감 · ${esc(l.name)}</div>`).join('')}
      ${ts.map(card).join('')}
      <button class="addrow wadd" data-again="wadd-${d}" data-wadd="${d}">+ 적기</button></div>`; }).join('')}</div>`;
}

function calPage(){                            // 월 달력 — 날짜 칸마다 그날 할 일과 목표 마감. 누르면 그날 화면
  const T = DB.today(), [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
  const start = DB.shift(DB.ymd(first), -lead), n = Math.ceil((lead + days) / 7) * 7;   // 월요일부터 — 주 보기 · 시간표 · 회고와 같게(09-25)
  const by = new Map(), dues = new Map(), MAX = 4;   // 칸마다 넷까지 — 넘으면 +N
  DB.todos().forEach(t => { if (t.date) spanDays(t).forEach(d => (by.get(d) || by.set(d, []).get(d)).push(t)); });
  DB.lists().forEach(l => { if (l.due && !l.done) (dues.get(l.due) || dues.set(l.due, []).get(l.due)).push(l); });
  DB.todos().forEach(t => { if (t.deadline && !t.done) (dues.get(t.deadline) || dues.set(t.deadline, []).get(t.deadline))
    .push({ name:t.text, color:t.listId && DB.listOf(t.listId) ? DB.listOf(t.listId).color : 'var(--c4)' }); });   // 할 일의 마감도
  const dot = l => l ? `<span class="gdot" style="background:${l.color}"></span>` : '';
  const bar = (t, d) => { const l = t.listId && DB.listOf(t.listId), s = d === t.date, e = d === t.endDate;   // 여러 날 — 첫날과 월요일에만 글을 적는다
    return `<span class="cl span ${s ? 's' : ''} ${e ? 'e' : ''} ${t.done ? 'done' : ''}" style="--sc:${l ? l.color : 'var(--c4)'}" title="${esc(t.text)} · ${dOnly(t.date)}~${dOnly(t.endDate)}">${s || new Date(d + 'T00:00:00').getDay() === 1 ? esc(t.text) : ''}</span>`; };
  let cells = '';
  for (let i = 0; i < n; i++){
    const d = DB.shift(start, i), mine = +d.slice(5, 7) === m;
    const all = by.get(d) || [], sp = all.filter(t => t.endDate).sort((a, b) => a.date.localeCompare(b.date) || (a.id < b.id ? -1 : 1));   // 여러 날 것은 맨 위 — 날마다 같은 줄에 오게
    const ts = all.filter(t => !t.endDate).sort((a, b) => a.done - b.done || DB.byWhen(a, b));   // 안 끝낸 것 먼저, 그 안에서 시각 순
    const lines = sp.map(t => bar(t, d)).concat((dues.get(d) || []).map(l => `<span class="cl due">${dot(l)}마감 · ${esc(l.name)}</span>`))
      .concat(ts.map(t => (l => `<span class="cl ${l ? 'g' : 'n'} ${t.done ? 'done' : ''}"${l ? ` style="--gc:${l.color}"` : ''}>${t.time ? `<b class="ct">${t.time}</b>` : ''}${esc(t.text)}</span>`)(t.listId && DB.listOf(t.listId))));   // 목표 색 칩 — 한국 인기 1위 여섯이 달력 칸에 분류 색 칩을 쌓는다(09-26 벤치마킹)
    cells += `<button class="cc ${mine ? '' : 'out'} ${d === T ? 'tdy' : ''} ${d < T ? 'past' : ''} ${redCls(d)}" data-cal="${d}" title="${dOnly(d)}${DB.holiday(d) ? ' ' + DB.holiday(d) : ''} 열기">
      <span class="chd"><span class="cn">${+d.slice(8)}</span>${holiName(d)}${DB.dayLine(d) ? '<span class="cmk" title="이 날 메모">메모</span>' : ''}</span>${lines.slice(0, MAX).join('')}${lines.length > MAX ? `<span class="cl more">+${lines.length - MAX}</span>` : ''}</button>`;
  }
  return `<div class="cal"><div class="cw">${[...'월화수목금토일'].map(w => `<span>${w}</span>`).join('')}</div><div class="cg" style="--wk:${n / 7}">${cells}</div></div>`;
}

    const first = day === T && !DB.todos().length && !DB.lists().length;   // 처음 온 사람 — 설명 창 없이 빈 칸에서 차이를 보여 준다(규칙 10)

    const un = DB.undated().sort(DB.byWhen);

    if (sp && sp.on + sp.off) html += `<div class="box dsum"><h2>${day === T ? '오늘' : '이 날'} 쓴 시간</h2>${timeLine(sp)}</div>`;
    else if (day === T && ts.some(t => t.listId && !t.done) && !Object.keys(DB.timeByDay()).length)   // 첫날 — 한 번도 안 잰 사람에게 자리를 먼저 보인다(규칙 10 · 09-26 채점 3판). 한 번 재면 다시 안 뜬다
      html += `<div class="box dsum wait"><h2>오늘 쓴 시간</h2><div class="ltime"><span><i class="k on"></i>정한 곳</span><span><i class="k off"></i>그 밖</span></div>
        <div class="split"></div><p class="wnote">목표의 일 옆 ▶를 누르면 여기서 하루가 정한 곳 / 그 밖으로 나뉩니다</p></div>`;
    const dm = DB.dayLine(day), dn = day === T ? '오늘' : '이 날';   // 날마다 메모 — 저녁 마무리의 한 줄과 같은 자리. 비어 있으면 회색 한 줄만(규칙 3)
    html += dm || memoOpen === day
      ? `<div class="box memo-box"><h2>${dn} 메모</h2><textarea data-daymemo="${day}" rows="2" placeholder="${dn} 남길 말 — 저녁 마무리의 한 줄도 여기 들어갑니다">${esc(dm)}</textarea></div>`
      : `<button class="addrow memoadd" data-memoopen="${day}">+ ${dn} 메모</button>`;
  }
  $('#body').innerHTML = html;
}

const FIRST_FRAMES = [['exam', '시험 준비 8주'], ['job', '취업 준비 12주'], ['term', '이번 학기']];   // t/ 폴더의 틀 중 처음 화면에 둘 것 — 이름은 틀 파일과 맞춘다. 한국 노션에서 많이 받는 주제 순(시간표 462 · 취준 204 · 학점 189 · 갓생 39 — 조사.md, 09-26 채점 1판)

/* ── 제자리 고치기 ── */
function startEdit(el, value, save){
  const i = document.createElement('input');
  i.className = 'edit' + (el.classList.contains('gn') ? ' big' : ''); i.value = value;
  el.replaceWith(i); i.focus(); i.select();
  let done = false;
  const fin = (ok, next) => { if (done) return; done = true;
    const v = i.value.trim(), changed = ok && v && v !== value;
    if (changed) save(v);
    if (next){ render(); if (!open) $('#add').focus(); }   // Enter·Esc — 커서를 입력칸으로 돌려 다음 할 일을 바로 적게
    else { if (changed) el.textContent = v; i.replaceWith(el); }
  };                                            // 다른 곳을 누름 — 화면을 갈아엎지 않아야 그 누름이 사라지지 않는다
  i.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;             // 한글을 조합하던 Enter 는 글자를 마치는 것이다
    if (e.key==='Enter') fin(true, true); if (e.key==='Escape') fin(false, true); });
  i.addEventListener('blur', () => fin(true, false));
}

/* ── 줄 더하기 ── 「+ 단계」「+ 할 일」「+ 새 분류」. Enter 로 하나 넣고 칸은 그대로 열려 다음 것을 받는다 */
function startAdd(btn, place, add, again = true){
  const i = document.createElement('input');
  i.className = 'edit'; i.placeholder = place;
  btn.replaceWith(i); i.focus();
  let done = false;
  i.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape'){ done = true; i.replaceWith(btn); return; }
    if (e.key !== 'Enter') return;
    const v = i.value.trim(); done = true;
    if (!v){ i.replaceWith(btn); return; }
    add(v); render();
    if (again){ const b = btn.dataset.again ? document.querySelector(`[data-again="${btn.dataset.again}"]`)
                                             : document.querySelector(`[data-lact="${btn.dataset.lact}"]`);
      if (b) startAdd(b, place, add, again); }
  });
  i.addEventListener('blur', () => { if (done) return; done = true;
    const v = i.value.trim(); i.replaceWith(btn);
    if (v){ add(v); setTimeout(() => { if (!editing()) render(); }, 250); } });   // 누른 것을 먼저 받고 나서 그린다
}

/* ── 시간 ── 멈추면 이번에 잰 만큼을 알리고, 되돌리면 멈추지 않은 것처럼 이어 돈다 */
function stopWithToast(id){
  const back = DB.stopRun(id); if (!back) return;
  const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
  const t = DB.todo(id), got = sum(t.spent) - sum(back.spent);   // 이번에 잰 만큼만 — 시간표로 적은 몫은 빼고
  toast(`멈췄습니다 · 「${t.text}」 ${fmtDur(got)}`, () => DB.unstop(id, back));
}
setInterval(() => { const r = DB.running();
  if (!r){ const b = brkLeft(); if (b === null) return; if (b === 0) return brkDone();
    document.querySelectorAll('[data-brkleft]').forEach(el => { el.textContent = fmtClock(b); }); return; }
  if (r.runEnd && DB.focusLeft(r) === 0) return focusDone(r);
  const s = fmtClock(DB.runSecs(r));
  document.querySelectorAll('[data-run]').forEach(el => { el.textContent = '● ' + s; });
  document.querySelectorAll('[data-runbar]').forEach(el => { el.textContent = s; });
  document.querySelectorAll('[data-focusleft]').forEach(el => { el.textContent = '남은 ' + fmtClock(DB.focusLeft(r)); }); }, 1000);

/* ── 집중 ── 재는 중에 25분 · 50분을 고르면 그 시간이 됐을 때 멈추고 알린다. 창을 닫았다 열어도 그 시각까지만 적힌다 */
let audio = null;
const beep = () => { try{ if (!audio) return; const t0 = audio.currentTime;
  [0, .25].forEach(d => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880;
    g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.2, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .18);
    o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + .2); }); }catch(e){} };
/* 쉬기 — 집중이 끝나면 5분 쉬기가 저절로. 끝나면 소리 · 알림 · 「다시 25분」. 이 브라우저 것이라 자료가 아니라 따로 둔다 */
/* ── 한 장씩 ── 지난 일을 하나씩. 한 것은 바로 적히고, 방금 것은 되돌릴 수 있다 */
var one = null;                                 // { kind:'past', ids, i, log:[{what, back}] }
function drawOne(){
  const el = $('#one'); if (!one){ el.classList.add('hide'); return; }
  if (one.kind === 'past') return drawPast(el);
  if (typeof drawFlow === 'function') drawFlow(el);
}
function drawPast(el){
  const T = DB.today(); let t = null;
  while (one.i < one.ids.length && !(t = DB.todo(one.ids[one.i]))) one.i++;
  if (one.i >= one.ids.length) return endPast();
  const l = t.listId && DB.listOf(t.listId), late = -ddays(t.date, T);
  el.classList.remove('hide');
  el.innerHTML = `<div class="card"><div class="top"><span>지난 일 ${one.i + 1} / ${one.ids.length}</span><button data-one="stop">그만</button></div>
    <div class="big">${esc(t.text)}</div>
    <div class="sub">${l ? `<span class="gdot" style="background:${l.color}"></span> ${esc(l.name)} · ` : ''}${dOnly(t.date)}에 있던 일 · ${late}일 밀림${t.movedCount ? ` · ${t.movedCount}번 옮김` : ''} · ${dOnly(DB.shift(t.endDate || t.date, DB.ARCH + 1))}에 보관함으로</div>${t.movedCount >= 2
      ? `<div class="hint">여러 번 옮긴 일은 할 시각을 정해 두면 하기 쉬워집니다 — 오늘로 옮긴 뒤 줄 끝 ⋯에서 시각</div>` : ''}
    <div class="acts"><button class="main" data-one="today">오늘로</button><button data-one="undated">날짜 빼기</button>
      <button data-one="done">끝냈음</button><button class="del" data-one="del">지우기</button></div>
    <div class="foot"><button data-one="undo" ${one.log.length ? '' : 'disabled'}>방금 것 되돌리기</button><button data-one="skip">건너뛰기</button></div></div>`;
}
function endPast(){
  const log = one.log, c = k => log.filter(x => x.what === k).length; one = null; render();   // 판을 닫기 전에 기록부터 떠 둔다
  const bits = [c('today') && `오늘로 ${c('today')}`, c('undated') && `날짜 뺌 ${c('undated')}`, c('done') && `끝 ${c('done')}`, c('del') && `지움 ${c('del')}`].filter(Boolean);
  if (log.length) toast(`정리했습니다 · ${bits.join(' · ')}`, () => log.slice().reverse().forEach(x => x.back()), 12000);
}
function onePast(a){
  if (a === 'stop') return endPast();
  if (a === 'undo'){ const x = one.log.pop(); if (x){ x.back(); one.i = Math.max(0, one.i - 1); } return render(); }
  if (a === 'skip'){ one.i++; return render(); }
  const id = one.ids[one.i], t = DB.todo(id); if (!t) { one.i++; return render(); }
  const b = { date:t.date, endDate:t.endDate || null, movedFrom:t.movedFrom, movedCount:t.movedCount };
  if (a === 'today'){ DB.moveTodo(id, DB.today()); one.log.push({ what:a, back:() => DB.editTodo(id, b) }); }
  if (a === 'undated'){ DB.editTodo(id, { date:null }); one.log.push({ what:a, back:() => DB.editTodo(id, b) }); }
  if (a === 'done'){ DB.toggleTodo(id); one.log.push({ what:a, back:() => DB.toggleTodo(id) }); }
  if (a === 'del'){ DB.removeTodo(id); one.log.push({ what:a, back:() => DB.restoreTodo(id) }); }
  one.i++; render();
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-oneby]')){ const ids = DB.past().map(t => t.id); if (ids.length){ one = { kind:'past', ids, i:0, log:[] }; render(); } return; }
  const b = e.target.closest('[data-one]'); if (b && one && one.kind === 'past') return onePast(b.dataset.one);
  if (one && e.target.id === 'one') { if (one.kind === 'past') endPast(); else { one = null; render(); } } });
document.addEventListener('keydown', e => { if (one && e.key === 'Escape'){ if (one.kind === 'past') endPast(); else { one = null; render(); } } });
/* ── 아침 계획 · 저녁 마무리 ── 누를 때만 연다(평소엔 안 묻는다). 고른 것은 끝낼 때 한 번에 적고, 한 번에 되돌린다 */
function startFlow(kind){
  const T = DB.today();
  if (kind === 'am'){ one = { kind, step:0, past:new Set(), und:new Set(), added:[] };

      if (t && p && p.time) DB.editTodo(t.id, { time:p.time, dur:p.dur }); if (t && p && p.rep) DB.setRepeat(t.id, p.rep);

  const cc = e.target.closest('[data-cal]');

  const nl = e.target.closest('#newlist');

  if (e.target.closest('[data-finfold]')){ showFin = !showFin; return render(); }

  const cr = e.target.closest('[data-carry]');

  const la = e.target.closest('[data-lact]');

    if (a === 'addstage') return startAdd(la, '단계 이름', v => DB.addStage(l.id, v));
    if (a === 'addtodo')  return startAdd(la, '할 일 · 날짜 없이 들어갑니다', v => DB.addTodo(v, l.id, null));

    if (a === 'reopen')   DB.reopenList(l.id);

    if (a === 'delall'){                        // 틀을 써 보고 치울 때 — 예시 지우기가 처음 쓰는 사람의 1번 마찰이었다(조사.md 6장). 끝낸 일은 기록이라 남긴다
      const undone = DB.todos().filter(t => t.listId === l.id && !t.done).map(t => t.id);
      undone.forEach(id => DB.removeTodo(id)); const ids = DB.removeList(l.id); open = null;
      toast(`지웠습니다 · 「${l.name}」 — 안 끝낸 할 일 ${undone.length}개도`, () => { undone.forEach(id => DB.restoreTodo(id)); DB.restoreList(l.id, ids); open = l.id; }); }

  const sd = e.target.closest('[data-sdo]');
  if (sd && open){
    const sid = sd.closest('[data-s]').dataset.s, s = DB.stageOf(DB.listOf(open), sid); if (!s) return;
    const a = sd.dataset.sdo, lid = open;
    if (a === 'edit')   return startEdit(sd, s.name, v => DB.editStage(lid, sid, { name:v }));
    if (a === 'toggle') DB.toggleStage(lid, sid);
    if (a === 'cur')    DB.setCur(lid, sid);
    if (a === 'del'){ DB.removeStage(lid, sid); toast(`지웠습니다 · 「${s.name}」`, () => DB.restoreStage(lid, sid)); }
    return render(); }

  if (e.target.closest('[data-daycopy]')){ copyFor = copyFor === 'day:' + day ? null : 'day:' + day; copyPick = new Set(); return render(); }
  const cpk = e.target.closest('[data-cpick]');   // 복사 — 날 고르기
  if (cpk){ const d = cpk.dataset.cpick; copyPick.has(d) ? copyPick.delete(d) : copyPick.add(d); return render(); }
  const cpd = e.target.closest('[data-cpdo]');
  if (cpd){ const a = cpd.dataset.cpdo, key = copyFor; if (!key) return;
    if (a === 'close'){ copyFor = null; copyPick = new Set(); return render(); }
    const ids = key.startsWith('day:') ? DB.todosOn(key.slice(4)).filter(t => t.date === key.slice(4)).map(t => t.id) : [key];
    const dates = a === 'same' ? [DB.todo(key).date] : [...copyPick].sort(); if (!dates.length || !ids.length) return;
    const made = DB.copyTodos(ids, dates); copyFor = null; copyPick = new Set(); render();
    return toast(a === 'same' ? '하나 더 만들었습니다' : `${dates.length}일에 복사했습니다 · ${made.length}개`, () => DB.dropTodos(made)); }
  const sb = e.target.closest('[data-subdo]');   // 하위 할 일
  if (sb){
    const tid = sb.closest('[data-t]').dataset.t, a = sb.dataset.subdo;
    if (a === 'add') return startAdd(sb, '하위 할 일', v => DB.addSub(tid, v));
    const sid = sb.closest('[data-sub]').dataset.sub, x = DB.subOf(tid, sid); if (!x) return;
    if (a === 'edit')   return startEdit(sb, x.text, v => DB.editSub(tid, sid, { text:v }));
    if (a === 'toggle') DB.toggleSub(tid, sid);
    if (a === 'del'){ DB.removeSub(tid, sid); toast(`지웠습니다 · 「${x.text}」`, () => DB.restoreSub(tid, sid)); }
    return render(); }

  const el = e.target.closest('[data-do]'); if (!el) return;
  const t = DB.todo(el.closest('[data-t]').dataset.t); if (!t) return;
  const a = el.dataset.do;
  if (a === 'quadpick'){ quadPick = quadPick === t.id ? null : t.id; return render(); }
  if (a === 'quad'){ const q = +el.dataset.q, was = DB.setQuad(t.id, q); quadPick = null; render();
    return toast(q ? `「${t.text}」 → ${QUADS[q - 1][1]}` : `「${t.text}」 4칸에서 뺐습니다`, () => DB.setQuad(t.id, was || 0)); }
  if (a === 'more'){ toolsOn = toolsOn === t.id ? null : t.id; toolsMore = null; return render(); }
  if (a === 'toolmore'){ toolsMore = toolsMore === t.id ? null : t.id; return render(); }
  if (a === 'copy'){ toolsOn = null; toolsMore = null; copyFor = copyFor === t.id ? null : t.id; copyPick = new Set(); return render(); }
  if (a === 'countup' || a === 'countdown'){ const r = DB.countUp(t.id, a === 'countup' ? 1 : -1); if (!r) return; render();
    if (r.full) toast(`다 채웠습니다 · 「${t.text}」 ${r.n}/${t.goal}`, () => { DB.toggleTodo(t.id); DB.countUp(t.id, -1); });
    return; }
  if (a === 'setgoal'){ const n = parseInt(prompt('하루에 몇 번 할까요? (2~99)', 3), 10);
    if (n >= 2 && n <= 99) DB.editTodo(t.id, { goal:n }); return render(); }
  if (a === 'nogoal'){ const was = t.goal; DB.editTodo(t.id, { goal:null }); render(); return toast(`세기를 뺐습니다 · 「${t.text}」`, () => DB.editTodo(t.id, { goal:was })); }
  if (a === 'detach'){ toolsOn = null; toolsMore = null; const r = DB.detachOnce(t.id); if (!r) return;
    render(); return toast(`이번 것만 떼어 냈습니다 · 반복은 ${dOnly(DB.todo(t.id).date)}부터`, () => DB.undetach(r)); }
  if (el.closest('.tools')){ toolsOn = null; toolsMore = null; }   // 도구를 하나 쓰면 접는다
  if (el.closest('.tools')){ document.body.classList.add('cool'); clearTimeout(coolT);
    coolT = setTimeout(() => document.body.classList.remove('cool'), 500); }

  if (a === 'toggle'){ const was = t.doneAt, r = DB.toggleTodo(t.id);
    if (r && r.done){
      // 끝낸 기쁨(규칙 7) — 오늘 정한 것을 다 하면 한 줄. 지난날은 세지 않는다(끊기는 기록이 안 되게), 점수 · % 없음
      const T = DB.today(), td = t.date === T ? DB.todosOn(T) : [], all = td.length >= 2 && td.every(x => x.done);
      toast(all ? `오늘 정한 ${td.length}개를 다 했습니다 · 「${t.text}」` : `끝냈습니다 · 「${t.text}」`, () => DB.toggleTodo(t.id));
      // 체크 칸이 제자리에서 한 번 튀고, 0.4초 뒤에 「끝낸 것」으로 접힌다 — 바로 접으면 튀는 게 안 보인다
      const li = el.closest('li'), rs = rowEls(), ri = rs.indexOf(li), nx = li && document.activeElement === li ? (rs[ri + 1] || rs[ri - 1] || {}).dataset : null;
      el.classList.add('on', 'pop'); clearTimeout(popT);
      popT = setTimeout(() => { if (!editing()) render(); if (nx && nx.t) focusRow(rowById(nx.t) || rowById(t.id)); }, 420); return; }   // 키보드로 끝냈으면 다음 줄로(09-26)
    else if (r && mode() === 'log')             // 되돌리면 끝낸 날도 원래 날로
      toast(`기록에서 뺐습니다 · 「${t.text}」`, () => { DB.toggleTodo(t.id); DB.editTodo(t.id, { doneAt:was }); }); }
  else if (a === 'edit')     return startEdit(el, t.text, v => DB.editTodo(t.id, { text:v }));
  else if (a === 'note'){
    openNotes.has(t.id) ? openNotes.delete(t.id) : openNotes.add(t.id); render();
    const n = openNotes.has(t.id) && document.querySelector(`textarea[data-note="${CSS.escape(t.id)}"]`);
    if (n){ n.focus(); n.selectionStart = n.selectionEnd = n.value.length; }
    return; }
  else if (a === 'subs'){                      // 펼치기 · 접기. 아직 없으면 펼치면서 바로 적는 칸을 연다
    const was = openSubs.has(t.id); was ? openSubs.delete(t.id) : openSubs.add(t.id); render();
    if (!was && !DB.subsOf(t).length){ const b = document.querySelector(`[data-again="sub-${CSS.escape(t.id)}"]`); if (b) b.click(); }
    return; }
  else if (a === 'tomorrow') DB.moveTodo(t.id, DB.shift(t.date > DB.today() ? t.date : DB.today(), 1));  // 지난 것도 진짜 내일로
  else if (a === 'toToday')  DB.moveTodo(t.id, DB.today());
  else if (a === 'start'){ const r = DB.startRun(t.id);
    if (r && r.was) toast(`「${DB.todo(r.was).text}」 멈추고 「${t.text}」 시작`); }   // 한 번에 하나만
  else if (a === 'stop')     stopWithToast(t.id);
  else if (a === 'timepick'){ const i = el.closest('li').querySelector('.tpick');
    try{ i.showPicker(); }catch(err){ i.focus(); } return; }
  else if (a === 'dlpick'){ const i = el.closest('li').querySelector('.dpick'); if (!i) return;
    try{ i.showPicker(); }catch(err){ i.focus(); i.click(); } return; }
  else if (a === 'cleardl'){ const was = t.deadline; DB.editTodo(t.id, { deadline:null });
    toast(`마감을 뺐습니다 · 「${t.text}」`, () => DB.editTodo(t.id, { deadline:was })); }
  else if (a === 'endpick'){ const i = el.closest('li').querySelector('.epick:not(.dpick)'); if (!i) return;
    try{ i.showPicker(); }catch(err){ i.focus(); i.click(); } return; }
  else if (a === 'clearend'){ const was = t.endDate; DB.editTodo(t.id, { endDate:null });
    toast(`기간을 뺐습니다 · 「${t.text}」`, () => DB.editTodo(t.id, { endDate:was })); }
  else if (a === 'cleartime'){ const was = t.time; DB.editTodo(t.id, { time:null });
    toast(`시각을 뺐습니다 · 「${t.text}」`, () => DB.editTodo(t.id, { time:was })); }
  else if (a === 'settime') return;
  else if (a === 'skip'){ const s = DB.skipTodo(t.id);
    if (s) toast(`건너뛰었습니다 · 다음은 ${dOnly(DB.todo(t.id).date)}`, () => DB.editTodo(t.id, { date:s.back })); }
  else if (a === 'del'){ DB.removeTodo(t.id); toast(`지웠습니다 · 「${t.text}」`, () => DB.restoreTodo(t.id)); }
  else return;
  render();
});

document.addEventListener('change', e => {
  if (e.target.id === 'dueIn'){ if (open) DB.editList(open, { due: e.target.value || null }); return render(); }
  if (e.target.matches && e.target.matches('.area-in')){   // 영역 — 적고 나가거나 Enter
    if (open) DB.editList(open, { area: e.target.value.trim().slice(0, 30) || null }); return render(); }
  const tp = e.target.closest('[data-do=settime]');
  if (tp){ const t = DB.todo(tp.closest('[data-t]').dataset.t);
    if (t){ DB.editTodo(t.id, { time: tp.value || null }); if (tp.value && t.date === DB.today()) offerNotify(DB.todo(t.id)); }
    return render(); }
  const cm = e.target.closest('[data-cpmore]');   // 복사 — 다른 날
  if (cm){ if (cm.value) copyPick.add(cm.value); return render(); }
  const dp = e.target.closest('[data-do=setdl]');
  if (dp){ const t = DB.todo(dp.closest('[data-t]').dataset.t); if (t) DB.editTodo(t.id, { deadline: dp.value || null }); return render(); }
  const ep = e.target.closest('[data-do=setend]');
  if (ep){ const t = DB.todo(ep.closest('[data-t]').dataset.t);
    if (t) DB.editTodo(t.id, { endDate: ep.value && ep.value > t.date ? ep.value : null }); return render(); }
  const rp = e.target.closest('[data-do=setrepeat]');
  if (rp){ const t = DB.todo(rp.closest('[data-t]').dataset.t); if (!t) return render();
    if (rp.value === 'days'){                  // 며칠마다 — 며칠인지 묻는다. 안 적거나 틀리면 그대로
      const was = t.repeat && t.repeat.every === 'days' ? t.repeat.n : 3;
      const n = parseInt(prompt('며칠마다 할까요? (2~365)', was), 10);
      if (n >= 2 && n <= 365) DB.setRepeat(t.id, { every:'days', n });
      return render(); }
    if (rp.value === 'pause' || rp.value === 'resume'){   // 잠시 멈춤 · 다시 하기
      const r0 = t.repeat, nx = { ...r0 }; if (rp.value === 'pause') nx.paused = true; else delete nx.paused;
      DB.setRepeat(t.id, nx); toast(rp.value === 'pause' ? `반복을 잠시 멈췄습니다 · 「${t.text}」` : `반복을 다시 합니다 · 「${t.text}」`, () => DB.setRepeat(t.id, r0));
      return render(); }
    if (rp.value === 'times'){                 // 주 N회 — 몇 번인지 묻는다
      const n = parseInt(prompt('일주일에 몇 번 할까요? (1~7)', t.repeat && t.repeat.every === 'times' ? t.repeat.n : 3), 10);
      if (n >= 1 && n <= 7) DB.setRepeat(t.id, { every:'times', n });
      return render(); }
    DB.setRepeat(t.id, rp.value || null); return render(); }
  const s = e.target.closest('[data-do=setlist]'); if (!s) return;
  const t = DB.todo(s.closest('[data-t]').dataset.t); if (!t) return;
  DB.editTodo(t.id, { listId: s.value || null }); render();
});

/* ── 메모 ── 적는 대로 0.4초 뒤에 저장하고, 칸을 떠날 때 한 번 더 저장한다 */
let noteT;

document.addEventListener('input', e => {
  const n = e.target.closest && e.target.closest('textarea[data-note]'); if (!n) return;

document.addEventListener('focusout', e => {

/* ── 시간표 끌기 ── 블록을 끌면 요일·시각, 아래 모서리는 길이, 칩은 칸에 놓으면 배치. 15분 단위.
   위 「시각 없음」 줄에 놓으면 시각이 빠지고, 맨 위 「날짜 없는 일」 줄에 놓으면 날짜가 빠진다. 전부 되돌릴 수 있다 */
let tdrag = null, swallowClick = false;
const snap15 = m => Math.round(m / 15) * 15;
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const ttTarget = (x, y) => { const el = document.elementFromPoint(x, y); if (!el) return null;
  const col = el.closest('[data-tcol]'), st = el.closest('[data-tstrip]'), tr = el.closest('[data-ttray]');
  return col ? { col } : st ? { strip:st } : tr ? { tray:tr } : null; };
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || mode() !== 'cal' || calMode !== 'time' || e.target.closest('[data-do]')) return;
  const rs = e.target.closest('[data-rs]'), b = e.target.closest('[data-tb]'), c = e.target.closest('[data-tchip]');
  if (!rs && !b && !c) return;
  const id = rs ? rs.dataset.rs : b ? b.dataset.tb : c.dataset.tchip, t = DB.todo(id); if (!t) return;
  e.preventDefault();
  tdrag = { id, kind: rs ? 'resize' : b ? 'block' : 'chip', x0:e.clientX, y0:e.clientY, moved:false, blk: rs ? rs.closest('[data-tb]') : b,
            grab: b && !rs ? (e.clientY - b.getBoundingClientRect().top) / PX : 0, dur: t.dur || 60, ghost:null, tg:null };
});
document.addEventListener('pointermove', e => {
  const g = tdrag; if (!g) return;
  if (!g.moved && Math.hypot(e.clientX - g.x0, e.clientY - g.y0) < 4) return;
  g.moved = true; document.body.classList.add('tdragging');
  if (g.kind === 'resize'){ g.newDur = Math.max(15, snap15(g.dur + (e.clientY - g.y0) / PX)); g.blk.style.height = Math.max(18, g.newDur * PX) + 'px'; return; }
  document.querySelectorAll('.tt-over').forEach(x => x.classList.remove('tt-over'));
  const tg = g.tg = ttTarget(e.clientX, e.clientY);
  if (g.ghost && (!tg || tg.col !== g.ghost.parentNode)){ g.ghost.remove(); g.ghost = null; }
  if (!tg) return;
  if (!tg.col) return (tg.strip || tg.tray).classList.add('tt-over');
  const r = tg.col.getBoundingClientRect();
  g.at = Math.max(0, Math.min(1440 - g.dur, snap15(H0 * 60 + (e.clientY - r.top) / PX - g.grab)));
  if (!g.ghost){ g.ghost = document.createElement('div'); g.ghost.className = 'tb-ghost'; tg.col.appendChild(g.ghost); }
  g.ghost.style.top = Math.max(0, (g.at - H0 * 60) * PX) + 'px'; g.ghost.style.height = Math.max(18, g.dur * PX) + 'px';
  g.ghost.textContent = fmtTime(hhmm(g.at));
});
document.addEventListener('pointerup', () => {
  const g = tdrag; if (!g) return; tdrag = null;
  document.body.classList.remove('tdragging'); if (g.ghost) g.ghost.remove();
  document.querySelectorAll('.tt-over').forEach(x => x.classList.remove('tt-over'));
  if (!g.moved) return;                         // 그냥 누른 것은 누르기가 맡는다
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);   // 끈 뒤 따라오는 click 은 버린다
  const t = DB.todo(g.id); if (!t) return render();
  const back = { date:t.date, time:t.time, dur:t.dur, movedFrom:t.movedFrom, movedCount:t.movedCount }, undoIt = () => DB.editTodo(g.id, back);
  if (g.kind === 'resize'){
    if (g.newDur && g.newDur !== (t.dur || 60)){ DB.editTodo(g.id, { dur:g.newDur }); toast(`길이를 ${fmtDur(g.newDur * 60)}으로 바꿨습니다 · 「${t.text}」`, undoIt); }
    return render(); }
  const tg = g.tg; if (!tg) return render();
  if (tg.col){ const d = tg.col.dataset.tcol; if (t.date && t.date !== d) DB.moveTodo(g.id, d);
    DB.editTodo(g.id, { date:d, time:hhmm(g.at), dur:t.dur || 60 });
    toast(`${dOnly(d)} ${fmtTime(hhmm(g.at))}에 놓았습니다 · 「${t.text}」`, undoIt); }
  else if (tg.strip){ const d = tg.strip.dataset.tstrip; if (t.date && t.date !== d) DB.moveTodo(g.id, d);
    DB.editTodo(g.id, { date:d, time:null }); toast(`시각을 뺐습니다 · 「${t.text}」`, undoIt); }

  render();

/* ── 키보드 ── 입력칸에서 ↓ 로 목록에 들어가고, ↑↓ 이동 · 스페이스 끝내기 · Enter 고치기 · Delete 지우기
   · Alt+↑↓ 순서 · Esc 입력칸으로. 어디서든 / 는 찾기 */
const rowEls = () => [...document.querySelectorAll('li.row[data-t]')];
const focusRow = el => { if (el){ el.focus(); el.scrollIntoView({ block:'nearest' }); } };
document.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const tg = e.target, inField = tg.matches && tg.matches('input, textarea, select');
  if (tg.id === 'add' && e.key === 'ArrowDown'){ if (!$('#sug').classList.contains('hide')) return;   // 제안이 떠 있으면 제안 쪽이 받는다
    const r = rowEls()[0]; if (r){ e.preventDefault(); focusRow(r); } return; }
  if (!inField && e.key === '/' && !e.metaKey && !e.ctrlKey){ e.preventDefault(); $('#q').focus(); return; }
  const li = tg.matches && tg.matches('li.row[data-t]') ? tg : null; if (!li) return;
  const all = rowEls(), i = all.indexOf(li), id = li.dataset.t;
  const entryOn = !$('.entry').classList.contains('hide');
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && e.altKey){
    e.preventDefault();
    const sibs = [...li.parentNode.children].filter(x => x.dataset && x.dataset.t), j = sibs.indexOf(li);
    const k = e.key === 'ArrowUp' ? j - 1 : j + 1; if (k < 0 || k >= sibs.length) return;
    if (e.key === 'ArrowUp') DB.placeBetween(id, sibs[k - 1] && sibs[k - 1].dataset.t, sibs[k].dataset.t);
    else DB.placeBetween(id, sibs[k].dataset.t, sibs[k + 1] && sibs[k + 1].dataset.t);
    render(); focusRow(rowById(id)); return; }
  if (e.key === 'ArrowDown'){ e.preventDefault(); focusRow(all[i + 1]); return; }
  if (e.key === 'ArrowUp'){ e.preventDefault(); if (i > 0) focusRow(all[i - 1]); else if (entryOn) $('#add').focus(); return; }
  if (e.key === 'Escape'){ e.preventDefault(); entryOn ? $('#add').focus() : li.blur(); return; }
  if (e.key === 'Enter'){ e.preventDefault(); li.querySelector('[data-do=edit]').click(); return; }
  const next = (all[i + 1] || all[i - 1] || {}).dataset;
  if (e.key === ' '){ e.preventDefault(); li.querySelector('[data-do=toggle]').click();
    focusRow(rowById(id) || rowById(next && next.t)); return; }   // 끝내면 접혀 사라지니 다음 줄로
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); li.querySelector('[data-do=del]').click();
    focusRow(rowById(next && next.t)); return; }
});

/* ── 날짜 알아듣기 ── 글의 맨 앞이나 맨 뒤에 따로 떨어진 낱말만 본다. 가운데는 건드리지 않는다.
   돌려주는 것: { text, date(없으면 undefined · 「언젠가」면 null), rep, label } — 알아들은 게 없으면 null */
function parseEntry(raw, T = DB.today()){
  const S1 = n => DB.shift(T, n), DAYS = '일월화수목금토';
  const valid = (y, m, d) => { const x = new Date(y, m - 1, d); return x.getMonth() === m - 1 && x.getDate() === d ? DB.ymd(x) : null; };
  const md = (m, d) => { const y = +T.slice(0, 4), a = valid(y, m, d); return a && a >= T ? a : valid(y + 1, m, d); };
  const dom = d => { let [y, m] = T.split('-').map(Number);
    for (let i = 0; i < 3; i++, m++){ const a = valid(y + Math.floor((m - 1) / 12), (m - 1) % 12 + 1, d); if (a && a >= T) return a; } return null; };
  const dow = w => { for (let i = 0; i < 7; i++) if (new Date(S1(i) + 'T00:00:00').getDay() === w) return S1(i); };
  const span = (a, m, d) => { if (!a) return null;                  // 기간 — 끝나는 날이 시작보다 앞이면 이듬해로 본다
    let y = +a.slice(0, 4), e = valid(y, m, d); if (e && e <= a) e = valid(y + 1, m, d);
    return e && e > a && Date.parse(e) - Date.parse(a) <= 60 * 864e5 ? { date:a, end:e } : null; };   // 해를 넘겨 두 달이 넘으면 거꾸로 적은 것으로 본다
  const yearly = (m, d) => { if (!valid(2028, m, d)) return null;   // 윤년에 있는 날이면 된다 — 2월 29일은 없는 해에 28일로
    const rep = { every:'year', mon:m, dom:d }; return { rep, date:DB.nextDate(rep, T) }; };
  const nextWeek = w => { const t = new Date(T + 'T00:00:00'), mon = DB.shift(T, 7 - (t.getDay() + 6) % 7); return DB.shift(mon, (w + 6) % 7); };
  const W = '([월화수목금토일])(?:요일)?';           // 「매주」「다음 주」 뒤에서만
  const W1 = '([월화수목금토일])요일|([화수목금토])';   // 홀로 설 때 — 「일」「월」 한 글자는 일(work)·달(month)과 헷갈려서 「요일」까지 붙여야 한다
  const hm = (h, m) => h >= 0 && h < 24 && m >= 0 && m < 60 ? String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') : null;
  const clock = (ap, h, m) => { h = +h; m = +m || 0;           // 「3시」처럼 오전·오후가 없으면 1~6시는 오후로 본다
    if (/오전|아침|새벽/.test(ap || '')) h = h === 12 ? 0 : h;
    else if (/오후|낮|저녁|밤/.test(ap || '')) h = h < 12 ? h + 12 : h;
    else if (h >= 1 && h <= 6) h += 12;
    return hm(h, m); };
  const toM = s => +s.slice(0, 2) * 60 + +s.slice(3);
  const range = (a, b) => { if (!a || !b) return null; let x = toM(a), y = toM(b);   // 「11시~1시」는 13시까지로
    if (y <= x) y += 720; const d = y - x; return d >= 15 && y <= 1440 ? { time:a, dur:d } : null; };
  const AP = '(오전|오후|아침|낮|저녁|밤|새벽)?\\s*', HK = '(\\d{1,2})시(?:\\s*(반|(\\d{1,2})분))?';
  const RULES = [                               // 긴 것을 먼저 본다 — 「2시~4시」가 「2시」보다, 「매주 수」가 「수」보다 먼저
    [`${AP}${HK}\\s*(?:[-~]|부터)\\s*${AP}${HK}(?:까지)?`, m => range(clock(m[1], m[2], m[3] === '반' ? 30 : m[4]), clock(m[5] || m[1], m[6], m[7] === '반' ? 30 : m[8]))],
    ['(\\d{1,2}):(\\d{2})\\s*[-~]\\s*(\\d{1,2}):(\\d{2})', m => range(hm(+m[1], +m[2]), hm(+m[3], +m[4]))],
    ['(오전|오후|아침|낮|저녁|밤|새벽)?\\s*(\\d{1,2})시(?:\\s*(반|(\\d{1,2})분))?', m => { const t = clock(m[1], m[2], m[3] === '반' ? 30 : m[4]); return t ? { time:t } : null; }],
    ['(\\d{1,2}):(\\d{2})', m => { const t = hm(+m[1], +m[2]); return t ? { time:t } : null; }],
    ['매년\\s*(\\d{1,2})월\\s*(\\d{1,2})일', m => yearly(+m[1], +m[2])],
    ['매년\\s*(\\d{1,2})[/.](\\d{1,2})', m => yearly(+m[1], +m[2])],
    ['매년|해마다', () => ({ rep:{ every:'year' } })],
    ['(\\d{1,3})일\\s*마다|(\\d{1,3})일에\\s*한\\s*번', m => { const n = +(m[1] || m[2]); return n >= 2 && n <= 365 ? { rep:{ every:'days', n } } : n === 1 ? { rep:{ every:'day' } } : null; }],
    ['격일', () => ({ rep:{ every:'days', n:2 } })],
    ['하루\\s*(\\d{1,2})\\s*(?:번|회|잔|개|쪽|장|세트|알|병|컵)', m => +m[1] >= 2 && +m[1] <= 99 ? { goal:+m[1] } : null],   // 하루 N번
    ['주\\s*(\\d)\\s*[회번]|일주일에\\s*(\\d)\\s*[회번]', m => { const n = +(m[1] || m[2]); return n >= 1 && n <= 7 ? { rep:{ every:'times', n } } : null; }],
    [`격주\\s*${W}`, m => ({ rep:{ every:'week', dow:DAYS.indexOf(m[1]), n:2 } })],
    [`(\\d{1,2})주\\s*마다\\s*${W}`, m => +m[1] >= 2 && +m[1] <= 12 ? { rep:{ every:'week', dow:DAYS.indexOf(m[2]), n:+m[1] } } : null],
    ['격주', () => ({ rep:{ every:'week', n:2 } })],
    ['(\\d{1,2})주\\s*마다', m => +m[1] >= 2 && +m[1] <= 12 ? { rep:{ every:'week', n:+m[1] } } : null],
    [`매주\\s*${W}`, m => ({ rep:{ every:'week', dow:DAYS.indexOf(m[1]) } })],
    [`매[달월]\\s*(\\d{1,2})일`, m => +m[1] >= 1 && +m[1] <= 31 ? { rep:{ every:'month', dom:+m[1] } } : null],
    ['매일', () => ({ rep:{ every:'day' } })],
    ['평일(?:마다)?', () => ({ rep:{ every:'weekday' } })],
    [`다음\\s*주\\s*${W}`, m => ({ date:nextWeek(DAYS.indexOf(m[1])) })],
    ['(오늘|내일|모레|글피)까지', m => ({ deadline:S1(['오늘', '내일', '모레', '글피'].indexOf(m[1])) })],   // 마감 — 「…까지」
    [`다음\\s*주\\s*${W}까지`, m => ({ deadline:nextWeek(DAYS.indexOf(m[1])) })],
    ['([월화수목금토일])요일까지|([화수목금토])까지', m => ({ deadline:dow(DAYS.indexOf(m[1] || m[2])), dlWeekly:true })],
    ['(\\d{1,2})[/.](\\d{1,2})까지', m => { const a = md(+m[1], +m[2]); return a ? { deadline:a } : null; }],
    ['(\\d{1,2})월\\s*(\\d{1,2})일까지', m => { const a = md(+m[1], +m[2]); return a ? { deadline:a } : null; }],
    ['(\\d{1,2})일까지', m => { const a = dom(+m[1]); return a ? { deadline:a } : null; }],
    ['(\\d{1,2})[/.](\\d{1,2})\\s*[-~]\\s*(\\d{1,2})[/.](\\d{1,2})', m => span(md(+m[1], +m[2]), +m[3], +m[4])],
    ['(\\d{1,2})월\\s*(\\d{1,2})일\\s*[-~]\\s*(?:(\\d{1,2})월\\s*)?(\\d{1,2})일', m => { const a = md(+m[1], +m[2]); return span(a, m[3] ? +m[3] : +m[1], +m[4]); }],
    ['(\\d{1,2})일?\\s*[-~]\\s*(\\d{1,2})일', m => { const a = dom(+m[1]); return a ? span(a, +a.slice(5, 7), +m[2]) : null; }],
    ['(\\d{1,2})월\\s*(\\d{1,2})일', m => { const a = md(+m[1], +m[2]); return a ? { date:a } : null; }],
    ['(\\d{1,2})[/.](\\d{1,2})', m => { const a = md(+m[1], +m[2]); return a ? { date:a } : null; }],
    ['(\\d{1,2})일', m => { const a = dom(+m[1]); return a ? { date:a } : null; }],
    ['오늘', () => ({ date:T })], ['내일', () => ({ date:S1(1) })], ['모레', () => ({ date:S1(2) })], ['글피', () => ({ date:S1(3) })],
    [W1, m => ({ date:dow(DAYS.indexOf(m[1] || m[2])) })],
    ['언젠가', () => ({ date:null })],
  ];
  let text = raw.trim(), got = {}, moved = true;
  while (moved){ moved = false;
    for (const [src, fn] of RULES){
      for (const re of [new RegExp(`^(?:${src})(?=\\s)`), new RegExp(`\\s(?:${src})$`)]){
        const m = text.match(re); if (!m) continue;
        const r = fn(m); if (!r) continue;
        if ((r.rep && got.rep) || ('date' in r && 'date' in got) || (r.time && got.time) || (r.deadline && got.deadline) || (r.goal && got.goal)) continue;   // 같은 종류는 한 번만
        const rest = text.replace(re, '').trim(); if (!rest) continue;       // 글이 다 없어지면 알아듣지 않는다
        Object.assign(got, r); text = rest; moved = true; break;
      }
      if (moved) break;
    }
  }
  if (!got.rep && !('date' in got) && !got.time && !got.deadline && !got.goal) return null;
  if (got.dlWeekly && got.date) while (got.deadline < got.date) got.deadline = DB.shift(got.deadline, 7);   // 「내일 … 금요일까지」 — 할 날 이후의 금요일
  if (got.rep && !('date' in got)){               // 반복만 있으면 첫 날은 규칙대로. 요일 · 날이 안 정해진 규칙은 오늘부터
    const r = got.rep, open = r.every === 'day' || r.every === 'days' || r.every === 'times' || (r.every === 'year' && !r.mon) || (r.every === 'week' && r.dow == null);
    got.date = open ? T : DB.nextDate(r, T); }
  if (got.rep && got.rep.every === 'week' && got.date) got.rep.dow = new Date(got.date + 'T00:00:00').getDay();
  if (got.rep && got.rep.every === 'year' && !got.rep.mon && got.date){ got.rep.mon = +got.date.slice(5, 7); got.rep.dom = +got.date.slice(8); }
  const has = 'date' in got;
  const when = !has ? '' : got.date === null ? '날짜 없음'
    : (got.date.slice(0, 4) !== T.slice(0, 4) ? got.date.slice(0, 4) + '년 ' : '')
      + (got.date === T ? '오늘' : got.date === S1(1) ? '내일' : dOnly(got.date)) + ' ' + weekday(got.date);
  const endT = got.time && got.dur ? hm(Math.floor((toM(got.time) + got.dur) / 60) % 24, (toM(got.time) + got.dur) % 60) : null;
  const label = [when + (got.end ? '~' + dOnly(got.end) : ''), got.time ? fmtTime(got.time) + (endT ? '~' + fmtTime(endT) : '') : '',
                 got.rep ? '↻ ' + repText(got.rep) : '', got.deadline ? dOnly(got.deadline) + '까지' : '', got.goal ? '하루 ' + got.goal + '번' : ''].filter(Boolean).join(' · ');
  return { text, date: has ? got.date : undefined, end: got.end || null, deadline: got.deadline || null, goal: got.goal || null, time: got.time || null, dur: got.dur || null, rep:got.rep || null, when, label };
}

/* ── 적기 ── */
let rawOnce = false;                            // 이번 글은 알아듣지 않고 그대로
const drawHint = () => { const v = $('#add').value, p = !rawOnce && v.trim() ? parseEntry(v) : null;
  $('#addHint').classList.toggle('hide', !p); if (p) $('#addHint').textContent = '→ ' + p.label + '  ×'; };
/* 자주 쓰는 일 — 적는 동안 전에 적던 글을 아래에 띄운다. ↓↑로 고르고 Enter, 또는 누르기.
   날짜 낱말(「내일」 등)은 그대로 두고 글만 바꾼다. 안 고르면 쓴 그대로 들어간다 */
let sugs = [], sugAt = -1, sugOff = false;
const entryParts = () => { const v = $('#add').value, p = !rawOnce && v.trim() ? parseEntry(v) : null, here = q ? DB.today() : day;
  return { v, p, part:(p ? p.text : v).trim(), date:p && p.date !== undefined ? p.date : here }; };
function drawSug(){
  const { part, date } = entryParts();
  sugs = part && !sugOff ? DB.suggest(part, 5, date) : []; if (sugAt >= sugs.length) sugAt = -1;
  $('#sug').classList.toggle('hide', !sugs.length);
  $('#sug').innerHTML = sugs.map((s, i) => { const l = s.listId && DB.listOf(s.listId);
    return `<button type="button" tabindex="-1" role="option" class="${i === sugAt ? 'on' : ''}" data-sug="${i}"><span class="st">${esc(s.text)}</span>${l
      ? `<span class="sl"><span class="gdot" style="background:${l.color}"></span>${esc(l.name)}</span>` : ''}</button>`; }).join('');
}
function addEntry(pick){                        // pick — 고른 제안. 없으면 쓴 그대로
  const { v, p, part, date } = entryParts(); if (!v.trim()) return;
  dayTick();
  const here = q ? DB.today() : day, text = pick ? pick.text : p ? p.text : v.trim();
  const t = DB.addTodo(text, $('#addList').value || (pick && pick.listId) || null, date);   // 분류를 골라 두었으면 그것, 아니면 전에 쓰던 분류
  if (t && p && p.rep) DB.setRepeat(t.id, p.rep);          // 적은 규칙 그대로 (매달 31일은 31일로)
  if (t && p && p.time) DB.editTodo(t.id, { time:p.time, dur:p.dur });
  if (t && p && p.end) DB.editTodo(t.id, { endDate:p.end });
  if (t && p && p.deadline) DB.editTodo(t.id, { deadline:p.deadline });
  if (t && p && p.goal) DB.editTodo(t.id, { goal:p.goal });
  $('#add').value = ''; rawOnce = false; sugAt = -1; sugOff = false; drawHint(); drawSug(); q = ''; $('#q').value = ''; $('#qx').classList.add('hide');
  render(); $('#add').focus();
  if (t && date !== here) toast(`${p.when}에 넣었습니다 · 「${t.text}」`, () => DB.removeTodo(t.id));   // 지금 화면에 안 보이는 곳으로 갔을 때
  else if (t && p && p.time) offerNotify(DB.todo(t.id));
}
$('#add').addEventListener('input', () => { if (!$('#add').value.trim()){ rawOnce = false; sugOff = false; } sugAt = -1; drawHint(); drawSug(); });
$('#add').addEventListener('blur', () => { sugAt = -1; $('#sug').classList.add('hide'); });
$('#add').addEventListener('focus', () => drawSug());
$('#addHint').addEventListener('click', () => { rawOnce = true; drawHint(); drawSug(); $('#add').focus(); });
$('#sug').addEventListener('pointerdown', e => e.preventDefault());   // 누르는 동안 입력칸이 초점을 잃지 않게
$('#sug').addEventListener('click', e => { const b = e.target.closest('[data-sug]'); if (b) addEntry(sugs[+b.dataset.sug]); });
$('#add').addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;   // 한글을 조합하던 Enter · 화살표는 글자를 마치는 것이다
  const open = !$('#sug').classList.contains('hide');
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault();
    sugAt = e.key === 'ArrowDown' ? Math.min(sugAt + 1, sugs.length - 1) : Math.max(sugAt - 1, -1); drawSug(); return; }
  if (open && e.key === 'Escape'){ e.preventDefault(); sugOff = true; sugAt = -1; drawSug(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault(); addEntry(open && sugAt >= 0 ? sugs[sugAt] : null);
});

/* ── 내보내기 알림 ── 자료를 잃는 게 이 시장의 1번 사인이다(2일차-리뷰-읽기.md). 내보낸 뒤로 바뀐 게 있고
   이레가 지났으면 위에 띠로 알린다. 내보낸 때는 이 브라우저 것이라 자료가 아니라 따로 둔다 */
const BK = DB.key + '.backup', BACKUP_DAYS = 7;
const readBK = () => { try{ return JSON.parse(localStorage.getItem(BK)) || {}; }catch(e){ return {}; } };
const writeBK = patch => { try{ localStorage.setItem(BK, JSON.stringify({ ...readBK(), ...patch })); }catch(e){} };
function backupDue(){
  const T = DB.today(), b = readBK(); if (b.later && b.later > T) return null;
  let last = '', first = '';
  for (const t of DB.todos()){ if (t.updatedAt > last) last = t.updatedAt; if (t.made && (!first || t.made < first)) first = t.made; }
  for (const l of DB.lists()) if (l.updatedAt > last) last = l.updatedAt;
  if (!last || (b.at && b.at >= last)) return null;            // 내보낸 뒤로 바뀐 게 없다
  const since = b.at ? DB.ymd(new Date(b.at)) : first; if (!since) return null;
  const days = -ddays(since, T); return days >= BACKUP_DAYS ? { days, never:!b.at } : null;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-backup]'); if (!b) return;
  if (b.dataset.backup === 'now') $('#out').click(); else { writeBK({ later:DB.shift(DB.today(), BACKUP_DAYS) }); render(); } });

/* ── 폰에서 잃는 길 둘(규칙 1) ── 앱 안 브라우저(인스타 · 카톡 · 페북 · 네이버 · 라인 …)의 자료는 사파리 · 크롬과 따로 있고, 그 앱이 지울 수도 있다.
   아이폰 사파리는 사파리를 쓴 날로 이레 동안 안 연 사이트의 저장을 지운다 — 홈 화면에 추가한 앱은 안 지운다(WebKit 블로그 2020-03) */
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER\(inapp|Line\/|DaumApps|Threads|everytimeApp|Snapchat/i;
function phoneRisk(ua = navigator.userAgent, alone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true){
  if (IN_APP.test(ua)) return 'inapp';
  const iSafari = /iPhone|iPad|iPod/.test(ua) && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  if (iSafari && !alone && DB.todos().length && !((readBK().homeLater || '') > DB.today())) return 'home';
  return null;
}
function riskHTML(k){
  if (k === 'inapp') return `앱 안 브라우저에서 열었습니다. 여기 적은 것은 사파리 · 크롬에서 안 보이고, 이 앱이 지울 수도 있습니다.
      ⋯ 메뉴의 「브라우저로 열기」를 누르거나 주소를 복사해 사파리 · 크롬에서 열어 주세요.<button data-risk="copy">주소 복사</button>`
    + (/Android/i.test(navigator.userAgent) ? `<a class="rb" href="intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end">크롬으로 열기</a>` : '');
  return `아이폰 사파리는 이레 동안 안 연 사이트의 자료를 지울 수 있습니다. 공유 단추 → 「홈 화면에 추가」로 설치해 쓰면 지우지 않습니다.<button data-risk="later">일주일 뒤에</button>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-risk]'); if (!b) return;
  if (b.dataset.risk === 'later'){ writeBK({ homeLater:DB.shift(DB.today(), 7) }); return render(); }
  const url = location.href;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(() => toast('주소를 복사했습니다 — 사파리 · 크롬 주소창에 붙여 넣으세요'))
    .catch(() => prompt('이 주소를 복사해 사파리 · 크롬에서 열어 주세요', url)); });

let storeAsked = false;                          // 저장을 붙잡아 달라고(persist) — 적은 게 생긴 뒤 한 번. 파이어폭스는 묻는 창을 띄우므로 처음 열 때는 안 부른다

/* ── 받은 틀(규칙 11) ── 주소 끝의 ?t=이름 → t/이름.json 을 받아 한 번 묻는다. 사람이 링크를 누른 뒤라 규칙 2에 맞다 */
let frameAsk = null;                            // { key, f } — 넣을지 묻는 중인 틀
let importAsk = null;                           // 가져온 파일 — 합칠지 바꿀지 묻는 중

let cardOn = false, cardNames = true;
function weekSums(wk){
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => DB.shift(wk, i)), tb = DB.timeByDay(), sum = { on:0, off:0 }, per = new Map();
  days.forEach(d => { if (tb[d]){ sum.on += tb[d].on; sum.off += tb[d].off; } });
  DB.todos().forEach(t => { const l = t.listId && DB.listOf(t.listId); if (!l || l.deletedAt) return;
    const x = days.reduce((a, d) => a + DB.secsOn(t, d), 0); if (x) per.set(l.id, (per.get(l.id) || 0) + x); });
  return { ...sum, goals: DB.lists().filter(l => per.has(l.id)).map(l => ({ name:l.name, color:l.color, secs:per.get(l.id) })) };
}
function makeCard(wk, names){                    // 1080×1350 — 인스타 세로 한 장
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), F = '"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif', s = weekSums(wk), lines = [];
  const say = (t, px, y, bold, col, X = 96, right = false, max = right ? 400 : W - X - 96) => { x.font = `${bold ? 700 : 400} ${px}px ${F}`; x.fillStyle = col;
    x.textAlign = right ? 'right' : 'left'; let u = t; while (x.measureText(u).width > max && u.length > 2) u = u.slice(0, -2) + '…';   // 넘치면 줄여서
    x.fillText(u, X, y); lines.push(u); };
  const pill = (X, Y, w, h, col) => { x.fillStyle = col; x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, h / 2) : x.rect(X, Y, w, h); x.fill(); };
  x.fillStyle = '#F6F4F1'; x.fillRect(0, 0, W, H);
  say('오션아워', 38, 150, true, '#2E2C29');
  say(`${dOnly(wk)} – ${dOnly(DB.shift(wk, 6))}`, 38, 150, false, 'rgba(46,44,41,.7)', W - 96, true);
  say('이번 주, 정한 곳에', 60, 330, true, '#2E2C29');
  say(fmtDur(s.on), 132, 490, true, '#2C5B88');
  say(`그 밖 ${fmtDur(s.off)}`, 44, 575, false, 'rgba(46,44,41,.7)');
  const tot = s.on + s.off; pill(96, 630, W - 192, 30, '#CFC8BF'); if (tot && s.on) pill(96, 630, Math.max(30, (W - 192) * s.on / tot), 30, '#2C5B88');
  let y = 790; s.goals.slice(0, 6).forEach((g, i) => { x.fillStyle = g.color; x.beginPath(); x.arc(112, y - 15, 13, 0, Math.PI * 2); x.fill();
    say(names ? g.name : `목표 ${i + 1}`, 44, y, false, '#2E2C29', 146, false, W - 146 - 330); say(fmtDur(g.secs), 44, y, false, 'rgba(46,44,41,.7)', W - 96, true); y += 86; });
  say('하루를 정한 곳에 썼는지 보여 주는 플래너', 32, H - 100, false, 'rgba(46,44,41,.7)');
  return { canvas:c, lines, tot };
}
