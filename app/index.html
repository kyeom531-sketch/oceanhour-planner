<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오션아워</title>
<meta name="description" content="내 의지가 부족한 게 아니라, 시스템이 없었던 거예요. 적어 둔 한 줄이 필요한 때에 먼저 뜬다">
<!-- 링크 미리보기(채점 16판 O21) — 카톡 · 인스타 DM으로 앱 링크(/app/)를 줄 때 그림 · 이름 · 설명이 뜬다 -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="오션아워">
<meta property="og:title" content="오션아워 — 내 의지가 부족한 게 아니라, 시스템이 없었던 거예요">
<meta property="og:description" content="내 의지가 부족한 게 아니라, 시스템이 없었던 거예요. 적어 둔 한 줄이 필요한 때에 먼저 뜬다">
<meta property="og:url" content="https://kyeom531-sketch.github.io/oceanhour-planner/app/">
<meta property="og:image" content="https://kyeom531-sketch.github.io/oceanhour-planner/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="오션아워 — 내 의지가 부족한 게 아니라, 시스템이 없었던 거예요. 적어 둔 한 줄이 필요한 때에 먼저 뜬다. 오른쪽은 실제 폰 화면">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-title" content="오션아워">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 글자는 --d70 까지만 흐리게 한다 (흰 바탕 대비 5.2, 옆 칸 바탕 4.8). --d32 는 입력칸 안 빈칸 안내(placeholder)에만 쓴다 — 누르는 글자 · 빈 화면 안내에 쓰면 4.5가 안 된다(10판 · 12판에서 잼) */
:root{
  --bg:#F6F4F1; --card:#FFF; --side:#F1EEEA; --line:rgba(40,38,35,.09);
  --ink:#2E2C29; --d70:rgba(46,44,41,.7); --d32:rgba(46,44,41,.32); --hov:rgba(46,44,41,.05);
  --c1:#A8415A; --c2:#8E6524; --c3:#3B6846; --c4:#2C5B88; --c5:#6B6762;
  --red:#C23A30;   /* 공휴일 · 일요일 — 흰 바탕 대비 5.3 */
  --r:10px;
  --warn-bg:#FAF0DC; --warn-ink:#8E6524;   /* 알림 띠 */
  color-scheme:light dark;
}
/* 어두운 화면 — 기기 설정을 따른다(설정 칸은 안 만든다). 09-26 진리로 다시 판단: 상위 12개 중 7개가 테마를 적었고,
   1억을 번 노션 OS가 어두운 판이다. 밤에 폰으로 저녁 마무리를 한다. 글자 대비는 밝은 판과 같이 4.5를 넘긴다 */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1B1A18; --card:#252321; --side:#201F1D; --line:rgba(236,232,226,.1);
    --ink:#ECE8E2; --d70:rgba(236,232,226,.7); --d32:rgba(236,232,226,.34); --hov:rgba(236,232,226,.07);
    --c1:#D98A9E; --c2:#CFA566; --c3:#7DB38B; --c4:#7EA8D8; --c5:#B3AEA7; --red:#E8776C;
    --warn-bg:#3A3020; --warn-ink:#E3C27F;
  }
  .gdot{filter:brightness(1.5) saturate(.85)}   /* 휴지통의 목표 점 — 색은 자료에 적힌 값이라 점만 밝힌다 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  display:flex;height:100vh;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
input,select{border:0;outline:0;background:transparent}

/* ── 사이드바 ── */
aside{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.brand{padding:13px 14px 9px;font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.find{margin:0 10px 8px;display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:8px;padding:5px 9px}
.find input{flex:1;min-width:0;font-size:13px}
.find .x{color:var(--d70);font-size:15px;line-height:1;flex:none}
.wrap .find{margin:0 0 8px}   /* 찾기 칸은 본문 맨 위 — 지금은 숨겨 둔다(3단계에서 돋보기가 연다) */
.lists{flex:1;overflow:auto;padding:0 8px}
.li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  color:var(--d70);padding:5px 6px;border-radius:7px;font-size:13.5px}
.li:hover{background:var(--hov)}
.li.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-weight:700}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n{font-size:11.5px;color:var(--d70);flex:none}
.epick{position:absolute;right:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.meta .back{font-size:11.5px;color:var(--c4);padding:1px 6px;border-radius:5px;white-space:nowrap}
.d .rep{font-size:12px;color:var(--c4)}   /* 반복이 걸린 일 — 끝내면 다음 차례가 새 줄로 생긴다(옛 자료) */
.meta .back:hover{background:var(--hov)}
#install{color:var(--c4)}

/* ── 본문 ── */
main{flex:1;overflow:auto}
#warn{display:none;background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;padding:8px 18px}
#warn.on{display:block}
#warn button{font-size:12px;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 35%,transparent);border-radius:6px;padding:1px 8px;margin-left:8px;background:transparent}
#warn button:hover{background:color-mix(in srgb,var(--warn-ink) 8%,transparent)}
#warn a.rb{font-size:12px;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 35%,transparent);border-radius:6px;padding:1px 8px;margin-left:6px;text-decoration:none;white-space:nowrap}
/* 아이콘 — 이동에만(규칙 12). 글과 같이 */
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li .ico{width:16px;height:16px;color:var(--d70)}
.li.on .ico{color:var(--ink)}
/* 가져온 파일 묻기 */
.frame p{font-size:13px;color:var(--d70);margin:2px 0 8px}
.fbtn{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 10px}
.fbtn button{font-size:13px;padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card)}
.fbtn button:first-child{background:var(--ink);color:var(--card);border-color:var(--ink)}
.wrap{max-width:820px;padding:16px 22px 70px;margin:0 auto}   /* 넓은 화면에서 가운데 — 1440에서 오른쪽 400px이 비었다(09-26 채점 2판) */
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:9px;position:relative}
.daybar h1{font-size:19px;margin:0;letter-spacing:-.025em}
.daybar .wd{font-size:13px;color:var(--d70)}
.daybar button{color:var(--d70);font-size:15px;padding:1px 6px;border-radius:6px;line-height:1.3}
.daybar button:hover{background:var(--hov);color:var(--ink)}
.daybar .moreb{margin-left:auto;font-size:16px;padding:1px 8px;letter-spacing:.05em;flex:none}
.daybar .moreb[aria-expanded=true]{background:var(--hov);color:var(--ink)}
.daybar.heads{flex-wrap:wrap;row-gap:2px}      /* 머리줄에 영문 라벨이 있으면 라벨이 위, 제목 · ⋯가 아래(덜어내기 3) */
.daybar .lab{flex-basis:100%;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--d70);line-height:1.2}
.daybar.heads h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.daybar h1 .n{font-size:14px;font-weight:400;color:var(--d70);letter-spacing:0;margin-left:2px}
.mlv.mfind{font-size:17px;padding:2px 10px;line-height:1.2}
.mempty{display:flex;align-items:center;gap:8px}
.mempty span{margin-right:auto}
/* ⋯ 안 — 입구가 모이는 곳. 머리줄 바로 밑에 펼친다 */
.morep{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin:0 0 12px}
.morep button,.morep a{display:block;text-align:left;font-size:13.5px;color:var(--ink);padding:7px 10px;border-radius:7px;text-decoration:none;line-height:1.4}
.morep button:hover,.morep a:hover{background:var(--hov)}
.morep .mp-t{font-size:11px;color:var(--d70);padding:8px 10px 0}
.morep .mp-note{font-size:11px;line-height:1.6;color:var(--d70);margin:0;padding:2px 10px 4px}
.morep .pvl{font-size:12.5px;color:var(--c4)}   /* 개인정보 처리방침(14판 — 앱스토어 제출에 든다) */

.entry{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--r);
  padding:9px 12px;box-shadow:0 1px 2px rgba(40,38,35,.04);margin-bottom:10px}
.entry .p{color:var(--d70);flex:none;line-height:1}
.entry input{flex:1;min-width:0;font-size:14px}
.entry input::placeholder{color:var(--d32)}
.hint{flex:none;font-size:12px;color:var(--c4);background:color-mix(in srgb,var(--c4) 9%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hint:hover{background:color-mix(in srgb,var(--c4) 16%,transparent)}

.box{background:var(--card);border-radius:var(--r);padding:2px 12px;
  box-shadow:0 1px 2px rgba(40,38,35,.04);margin-bottom:10px}
.box h2{font-size:12px;font-weight:700;color:var(--d70);margin:0;padding:8px 0 4px;
  letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.gdot{width:7px;height:7px;border-radius:50%;flex:none}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 8px;padding:5px 0;
  border-top:1px solid var(--line);position:relative;min-width:0}
li.row:first-child{border-top:0}
/* 줄에 초점 — Alt+↑↓는 같은 날 안의 순서 */
li.row:focus{outline:none}
li.row:focus-visible{background:var(--hov);border-radius:4px;box-shadow:inset 2px 0 0 var(--c4)}
.ck{width:15px;height:15px;margin-top:2px;border:1.4px solid color-mix(in srgb,var(--ink) 55%,transparent);
  border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center}
.ck:hover{border-color:var(--ink)}
.ck.on{background:var(--c3);border-color:var(--c3)}
/* 마우스 화면도 누르는 자리 24px(11판, WCAG 2.5.8) — 도구를 펼치면 ▶ · ⋯ 곁에 단추가 붙어 간격으로도 모자랐다 */
.meta .more{position:relative}
.meta .more::after{content:'';position:absolute;inset:min(0px,calc(50% - 12px))}
.tabs{display:none}
/* 손가락으로 쓸 때(폰 · 태블릿) — 누르는 자리 44px(애플) · 입력칸 16px(아이폰은 작으면 확대한다). 보이는 크기는 거의 그대로 */
@media (pointer:coarse){
  input,select,textarea{font-size:16px!important}
  li.row{padding-top:10px;padding-bottom:10px;min-height:44px}
  .ck{position:relative}
  .ck::before{content:'';position:absolute;inset:-14px -10px -14px -14px}
}
@keyframes ckpop{0%{transform:scale(.7)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.ck.pop{animation:ckpop .24s ease-out}
@media (prefers-reduced-motion:reduce){.ck.pop{animation:none}}
.ck.on::after{content:'';width:4px;height:7.5px;border:solid var(--card);border-width:0 1.6px 1.6px 0;
  transform:rotate(43deg) translate(-.5px,-1px)}
.tx{flex:1;min-width:0;cursor:pointer;border-radius:4px;padding:0 2px;margin:0 -2px;overflow-wrap:anywhere;text-align:left}
.tx:hover{background:var(--hov)}
li.done .tx{color:var(--d70);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:7px;flex:none;min-height:20px;position:relative}
.meta .d{font-size:11.5px;color:var(--d70);white-space:nowrap}
/* 줄 도구 — 글을 누르면 그 줄 밑에 펴진다(덜어내기 4). 마우스를 올려도 안 뜬다 */
.tools{display:none}
li.row.tools-on .tools{display:flex;flex-wrap:wrap;gap:5px;order:9;flex-basis:100%;justify-content:flex-end;padding:6px 0 2px}
li.row:has(.edit) .tools{display:none!important}
body.cool .tools{pointer-events:none!important}   /* 도구를 누른 직후 0.5초 — 줄이 밀려 다른 단추가 손 밑에 와도 두 번 눌리지 않게 */
.tools button{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);white-space:nowrap}
.tools button:hover{background:var(--hov)}
.edit{width:100%;font-size:14px;background:var(--hov);border-radius:4px;padding:0 2px;margin:0 -2px}
.empty{color:var(--d70);font-size:13px;padding:7px 0 11px}   /* 빈 화면 안내도 읽는 글이다 — --d32(1.9)였다(12판에 빈 화면을 처음 쟀다) */
.addrow,.fold{display:block;width:100%;text-align:left;font-size:13px;padding:6px 0 8px}
.addrow{color:var(--d70)}
.addrow:hover{color:var(--ink)}
.fold{color:var(--d70);font-size:12px;border-top:1px solid var(--line)}
.fold:hover{color:var(--ink)}
.mlist{list-style:none;margin:0;padding:0 0 6px}
.mhit{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.mlist li:first-child .mhit{border-top:0}
.mhit .mt{flex:none;font-weight:700}
.mhit .msnip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--d70);font-size:12.5px}
/* 키보드 초점(채점 13판) — 입력칸 · 선택 상자는 outline을 지웠던 자리라 따로 보인다. 입력칸 · 찾기는 상자에, 할 일 줄의 목표 점은 점에 */
.entry:focus-within,.find:focus-within{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c4) 55%,transparent)}
select:focus-visible{outline:2px solid color-mix(in srgb,var(--c4) 60%,transparent);outline-offset:2px;border-radius:4px}
textarea:focus-visible{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c4) 55%,transparent)}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;
  pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 13px;
  font-size:13px;display:flex;gap:11px;align-items:center;transition:.15s;max-width:90vw;
  box-shadow:0 4px 14px rgba(40,38,35,.2)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--card);opacity:.6;font-size:12.5px;text-decoration:underline;flex:none}
#toast button:hover{opacity:1}
.hide{display:none!important}
@media(max-width:700px){ aside{width:180px} .wrap{padding:14px 16px 60px} }
.topbar{display:none}
/* ── 메모(09-27 웹 첫 판) ── 앱의 앞. 이번 주의 한 줄 · 적는 칸 · 지금 떠 있는 메모 · 메모 모음(규칙 2 · 3 · 4 · 7 · 8) */
.wline{background:color-mix(in srgb,var(--c4) 7%,var(--card));border-radius:var(--r);padding:9px 14px 11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,38,35,.04)}
.wl-h{display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:700;color:var(--d70);letter-spacing:.02em}
.wl-h .wl-wk{font-weight:400}
.wl-t{display:block;text-align:left;width:100%;font-size:17px;line-height:1.45;letter-spacing:-.02em;padding:3px 0 0;color:var(--ink);white-space:pre-wrap}
.wl-t.empty{font-size:14px;color:var(--c4)}
.wl-t:hover{color:var(--c4)}
.wl-c{display:block;font-size:11.5px;color:var(--d70);padding-top:3px}
.wline input.edit{font-size:17px;width:100%;margin-top:3px}
.mentry{background:var(--card);border-radius:var(--r);padding:10px 12px 8px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,38,35,.04)}
.mentry textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);min-height:24px;max-height:40vh;padding:0}
.mentry textarea::placeholder{color:var(--d32)}
.mopts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-top:7px;margin-top:7px;border-top:1px solid var(--line)}
.moods{display:flex;gap:2px;align-items:center}
.mood{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative}
.mood i{width:14px;height:14px;border-radius:50%;background:var(--mc);opacity:.32}
.mood:hover i{opacity:.7}
.mood.on i{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 25%,transparent)}
.mo1{--mc:var(--c1)} .mo2{--mc:var(--c2)} .mo3{--mc:var(--c5)} .mo4{--mc:var(--c3)} .mo5{--mc:var(--c4)}
.mlab{font-size:12px;color:var(--d70);min-width:4.5em}
.mshow{font-size:12.5px;color:var(--d70);display:inline-flex;align-items:center;gap:4px}
.mshow select{color:var(--ink);font-size:12.5px;cursor:pointer}
.madd{margin-left:auto;font-size:13px;padding:5px 14px;border-radius:7px;background:var(--ink);color:var(--card)}
.mopen{font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--card)}   /* 「기분」 — 비었을 때 기분 칸을 여는 단추(대표님 10-04). 열려 있으면 테두리가 진하다 */
.mopen[aria-expanded=true]{border-color:var(--d70)}
.mopen:disabled{cursor:default}   /* 글이나 기분이 있으면 칸이 늘 열려 있어 닫을 수 없다 */
.mat{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--d70)}
.mat input,.mat select{font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--card)}
li.row.mrow{align-items:flex-start;flex-wrap:wrap}
.mdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--mc)}
.mtx{flex:1 1 60%;min-width:0;white-space:pre-wrap;font-size:14px;line-height:1.5;padding:1px 0}

/* ── 폰 ── 옆 칸은 왼쪽 서랍, 줄 도구는 「⋯」로 줄 아래에, 재는 시간은 화면 아래에 붙인다(09-25) */
@media(max-width:640px){
  body{height:100dvh}
  aside{display:none}   /* 폰은 옆 칸 없이 아래 탭 둘 — 나머지는 ⋯ 안에(덜어내기 2) */
  .topbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:25;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 6px) 8px 4px}
  .topbar .tb-t{font-weight:700;font-size:14.5px;letter-spacing:-.02em}
  .wrap{padding:4px 12px calc(96px + var(--tabh))}
  .daybar{flex-wrap:wrap;row-gap:6px}
  .daybar h1{white-space:nowrap}
  input,select,textarea{font-size:16px!important}   /* 16px 보다 작으면 아이폰이 누를 때마다 화면을 확대한다 — .entry input 같은 규칙에 밀려 안 먹던 것을 09-26 고쳤다 */
  :root{--tabh:calc(52px + env(safe-area-inset-bottom))}
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);position:fixed;left:0;right:0;bottom:0;z-index:32;height:var(--tabh);
    padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
  .tabs button{font-size:11.5px;color:var(--d70);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tabs .ico{width:21px;height:21px}
  .tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--ink)}
  li.row .tx{font-size:15px}
  /* 적는 동안 입력칸 — 뜻 칩 · 목표 고르기가 같은 줄에 붙어 390에서 93px(글자 여섯)이었다(14판). 칩은 아랫줄로 내리고 입력칸은 한 줄을 쓴다 */
  .entry{flex-wrap:wrap;row-gap:4px}
  .entry input{min-width:calc(100% - 130px)}
  .entry .hint{order:9;margin-left:17px}
  .li{padding:9px 8px;font-size:15px}
  /* 줄 도구 */
  .meta .more{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;margin:-8px -4px -8px 0;
    color:var(--d70);font-size:16px;letter-spacing:1px;border-radius:6px}
  li.row.tools-on .meta .more{background:var(--hov);color:var(--ink)}
  .tools button{padding:6px 10px;font-size:13px}
  #toast{bottom:calc(var(--tabh) + 64px)}
}
/* 손가락 누르는 자리 44px(10판, 애플 기준) — 재 보니 폰에서 165곳이 작았다. 할 일 줄은 그대로 열둘이 보이게, 손가락이 닿는 자리만 넓힌다.
   한 줄에 놓인 작은 단추는 ::after로 44까지 넓히고, 위아래로 쌓인 줄은 줄 높이를 44로 한다(넓히면 이웃과 겹친다).
   11판 — 폭으로 가르지 않고 손가락 기기 전부(태블릿도 44) */
@media (pointer:coarse){
  .ck::before{inset:min(-14px,calc(50% - 22px))}
  .tx,button.mtx{position:relative}
  .tx::before,button.mtx::before{content:'';position:absolute;inset:min(0px,calc(50% - 22px)) -3px}
  :is(.daybar button,.meta .more,.meta .back,.entry .hint){position:relative}
  :is(.daybar button,.meta .more,.meta .back,.entry .hint)::after{content:'';position:absolute;
    top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px));left:min(0px,calc(50% - 22px));right:min(0px,calc(50% - 22px))}
  .li,.fold,.addrow,.mhit,
    .tools button,.fbtn button{min-height:44px}
  .fold,.addrow{display:flex;align-items:center;padding-top:0;padding-bottom:0}
  .li{padding-top:0;padding-bottom:0}
  .entry input,.find input{min-height:44px;margin:-10px 0}
  .morep button,.morep a{min-height:44px;display:flex;align-items:center}
  .tools button{min-width:44px}
}
</style>

    <span class="mp-t" id="keepT"></span>
    <p class="mp-note">적은 것은 모으지 않고 이 기기 브라우저에만 둔다. 다만 이번 주에 처음 왔는지 · 다시 왔는지만 앱과 다른 주소로 이름 없이 센다</p>

<nav class="tabs" id="tabs" aria-label="화면 옮기기"><button data-view="memo">메모</button><button data-view="today">오늘</button></nav>
<div id="toast"><span id="tmsg" role="status"></span><button id="tundo">되돌리기</button></div>   <!-- role=status — 「넣었습니다」 · 「끝냈습니다」가 화면 읽기에도 들린다(채점 16판 D19) -->

<script>
/* ══════════════ 자료 층 ══════════════
   화면을 전혀 모른다. 여기만 들고 가면 앱판으로 옮길 수 있다.
   모양은 `자료.md` 를 따른다. 바꿀 때 거기도 같이 고친다.          */
const DB = (() => {
  const KEY = 'oceanhour';
  const V = 1;                                  // 이 앱이 읽을 줄 아는 자료 판
  const NEWER = '더 새 판 오션아워가 만든 자료라 이 판에서는 열 수 없습니다';
  const COLORS = ['#A8415A','#8E6524','#3B6846','#2C5B88','#6B6762','#2A7B7B','#6B4E9B','#B85C2E'];   // 09-26 다섯 → 여덟(규칙 12 — 잘 되는 앱은 목표 색을 여러 가지로 쓴다)
  let S = { v:V, lists:[], todos:[], reviews:{}, days:{}, opens:{}, memos:[], weeks:{}, recall:null };
  /* 감정 이름(09-27, 규칙 7) — 값은 영어 낱말, [한국어 이름, 애플 건강 「마음 상태」 이름(HKStateOfMind.Label)].
     앞 열둘이 늘 보이고(괴로운 쪽 여덟 · 좋은 쪽 넷 — 한국어 감정 낱말의 72%가 불쾌 쪽, 박인조 · 민경환 2005), 나머지는 「더 보기」.
     더 보기 맨 앞은 가장 익숙 · 가장 유쾌한 낱말(기쁨 · 홀가분). 애플 38개가 모두 들어 있다(검사.js) */
  const FEELS = {
    tense:['긴장','stressed'], anxious:['불안','anxious'], stressed:['스트레스','stressed'], drained:['지침','drained'],
    upset:['속상','disappointed'], down:['우울','sad'], angry:['화남','angry'], lonely:['외로움','lonely'],
    happy:['행복','happy'], proud:['뿌듯','proud'], grateful:['고마움','grateful'], peaceful:['편안','peaceful'],
    joyful:['기쁨','joyful'], relieved:['홀가분','relieved'],
    amazed:['감탄','amazed'], amused:['재밌음','amused'], annoyed:['짜증','annoyed'], ashamed:['수치심','ashamed'], brave:['용기','brave'],
    calm:['차분','calm'], confident:['자신감','confident'], content:['만족','content'], disappointed:['실망','disappointed'],
    discouraged:['낙담','discouraged'], disgusted:['역겨움','disgusted'], embarrassed:['민망','embarrassed'], excited:['신남','excited'],
    frustrated:['답답','frustrated'], guilty:['죄책감','guilty'], hopeful:['희망','hopeful'], hopeless:['절망','hopeless'],
    indifferent:['무덤덤','indifferent'], irritated:['거슬림','irritated'], jealous:['질투','jealous'], overwhelmed:['버거움','overwhelmed'],
    passionate:['열정','passionate'], sad:['슬픔','sad'], satisfied:['흡족','satisfied'], scared:['두려움','scared'],
    surprised:['놀람','surprised'], worried:['걱정','worried'] };
  const FEEL_FRONT = ['tense','anxious','stressed','drained','upset','down','angry','lonely','happy','proud','grateful','peaceful'];
  const MOODS = ['아주 힘듦','힘듦','그저 그럼','좋음','아주 좋음'];   // 기분 1~5
  const LEADS = [0, 10, 30, 60];                                        // 정한 시각 — 몇 분 전부터 뜨나
  const isAt = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(s);   // 벽시계 시각 "2026-10-03T14:00"
  const cleanShow = x => {                      // 띄우기 — 모르는 모양은 「안 띄움」
    if (!x || typeof x !== 'object') return null;
    if (x.kind === 'span' && /^\d{4}-\d{2}-\d{2}$/.test(x.from) && /^\d{4}-\d{2}-\d{2}$/.test(x.to) && x.to >= x.from) return { kind:'span', from:x.from, to:x.to };
    if (x.kind === 'at' && isAt(x.at)) return { kind:'at', at:x.at, lead: LEADS.includes(+x.lead) ? +x.lead : 0,
      ...(x.mid === false ? { mid:false } : {}), ...(/^\d{4}-\d{2}-\d{2}$/.test(x.seen || '') ? { seen:x.seen } : {}) };   // mid — 중간에 한 번(끄면 false) · seen — 그것을 내린 날
    if (x.kind === 'until') return { kind:'until', from: /^\d{4}-\d{2}-\d{2}$/.test(x.from) ? x.from : null };
    if (x.kind === 'again' && /^\d{4}-\d{2}-\d{2}$/.test(x.from)) return { kind:'again', from:x.from, ...(/^\d{4}-\d{2}-\d{2}$/.test(x.seen || '') ? { seen:x.seen } : {}) };
    return null; };
  const AGAIN = [1, 3, 7, 14, 30, 60];          // 다시 띄우기 — 적은 날에서 며칠 뒤. 간격을 벌려 가며 다시 볼수록 오래 남는다(간격 효과, Cepeda 2006)
  const HARD = ['angry','annoyed','anxious','ashamed','disappointed','discouraged','disgusted','drained','embarrassed','frustrated','guilty',
                'hopeless','irritated','jealous','lonely','overwhelmed','sad','scared','stressed','worried'];   // 애플 건강의 불쾌한 쪽 이름
  const isHard = m => (m.mood && m.mood <= 2) || (m.feel || []).some(f => HARD.includes((FEELS[f] || [])[1]));
  const txt1 = (s, n) => (s == null ? '' : String(s)).trim().slice(0, n);
  const cleanLink = x => !x || typeof x !== 'object' || !['t', 'l'].includes(x.k) || typeof x.id !== 'string' || !x.id || x.id.length > 80 ? null   // 붙인 할 일(t) · 목표(l)(09-28)

  /* 파일에서 오든 저장소에서 오든, 들어오는 자료는 여기를 거친다.

  function load(){                              // 처음 열 때, 그리고 다른 탭이 저장했을 때

  const live      = a => a.filter(x => !x.deletedAt);

  /* ── 분류 · 목표 ── 목표는 새 것이 아니라 분류에 칸(due·stages·cur·done·doneAt)이 붙은 것이다 (자료.md) */
  function addList(name){

  const areas = () => [...new Set(lists().map(l => l.area).filter(Boolean))];   // 처음 나온 차례

  function removeList(id){                      // 분류만 지운다. 할 일은 남고, 어느 할 일이 떨어졌는지 돌려준다
    fresh();

    const ids = [];
    l.deletedAt = now(); l.updatedAt = now();

  /* ── 하위 할 일 ── 할 일 안의 작은 목록. 한 겹만. 다 끝내도 위 할 일은 스스로 안 끝난다 — 끝내는 건 사람이 한다 */
  const subsOf = t => live(t.subs || []);

  function addSub(tid, text){

  /* ── 반복 ── 따로 도는 시계가 없다. 끝내는 순간 다음 것 하나만 만든다. 연속 기록은 세지 않는다 */

  function detachOnce(id){                      // 이번만 따로 — 이번 것은 반복 없는 할 일로 떼어 내고, 반복은 다음 날부터 그대로

function startEdit(el, value, save, onEnd){
  const i = document.createElement('input');
  i.className = 'edit'; i.value = value;
  el.replaceWith(i); i.focus(); i.select();
  let done = false;
  const fin = (ok, next) => { if (done) return; done = true;
    const v = i.value.trim(), changed = ok && v && v !== value;
    if (changed) save(v);
    if (next){ render(); focusEntry(); }   // Enter·Esc — 커서를 입력칸으로 돌려 다음 할 일을 바로 적게(메모 화면이면 메모 칸)
    else { if (changed) el.textContent = v; i.replaceWith(el); if (!changed && onEnd) onEnd(); }   // 바깥을 눌러 그만둔 채 — 다시 그리지는 않고(그 누름이 사라진다) 빈 자리만 치운다
  };                                            // 다른 곳을 누름 — 화면을 갈아엎지 않아야 그 누름이 사라지지 않는다
  i.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;             // 한글을 조합하던 Enter 는 글자를 마치는 것이다
    if (e.key==='Enter') fin(true, true); if (e.key==='Escape') fin(false, true); });
  i.addEventListener('blur', () => fin(true, false));
}

let wallOn = false, wallShape = null, wallDark = true, wallWeek = true, wallPick = new Set(), wallCache = { k:'' };

  return [...[...wallPick].filter(id => !got.has(id)).map(id => DB.memo(id)).filter(m => m && m.text && !m.deletedAt), ...list]; };   // 줄 도구에서 고른 옛 메모도 목록에 보인다

function wrapText(x, t, max, most){               // 폭에 맞춰 줄로 — 빈칸에서 먼저 끊고, 긴 말은 글자에서. 넘치면 끝에 …
  const out = [];
  for (const para of String(t).split('\n')){
    let cur = '';
    for (const w of para.split(/(\s+)/)){
      if (x.measureText(cur + w).width <= max){ cur += w; continue; }
      if (cur.trim()) out.push(cur.trimEnd()); cur = w.trimStart();
      while (x.measureText(cur).width > max){ let i = cur.length; while (i > 1 && x.measureText(cur.slice(0, i)).width > max) i--; out.push(cur.slice(0, i)); cur = cur.slice(i); }
    }
    if (cur.trim()) out.push(cur.trimEnd());
  }
  if (out.length > most){ out.length = most; let l = out[most - 1]; while (l.length > 1 && x.measureText(l + '…').width > max) l = l.slice(0, -1); out[most - 1] = l + '…'; }
  return out;
}
function makeWall(shape, dark, week, ids){
  const { W, H } = WALL[shape], c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), F = '"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,sans-serif';
  const P = dark ? { bg:'#1E1D1B', ink:'#F2EFEA', sub:'rgba(242,239,234,.55)', ac:'#8DB8E3' } : { bg:'#F6F4F1', ink:'#2E2C29', sub:'rgba(46,44,41,.6)', ac:'#2C5B88' };
  const ph = shape === 'phone', L = ph ? 120 : 640, max = W - L * 2;   // 폰은 위쪽을 시계가 쓴다 · 컴퓨터는 가운데에(양옆 아이콘을 비킨다)
  const top = ph ? Math.round(H * .42) : Math.round(H * .16), room = (ph ? Math.round(H * .84) : Math.round(H * .86)) - top;
  const S = ph ? { lab:40, wk:68, wkL:94, mm:48, mmL:70, gap:46 } : { lab:40, wk:84, wkL:114, mm:54, mmL:80, gap:44 };
  const font = (px, b) => { x.font = `${b ? 700 : 400} ${px}px ${F}`; };
  const ops = []; let y = 0, used = 0, dropped = 0;
  const line = (t, px, b, col, lh, X = L) => { ops.push({ t, px, b, col, X, y:y + Math.round((lh + px * .72) / 2) }); y += lh; };
  const wl = week ? DB.weekLine(DB.monday(DB.today())).line : '';
  if (wl){ line('이번 주의 한 줄', S.lab, true, P.ac, S.lab + 22); font(S.wk, true); wrapText(x, wl, max, 4).forEach(l => line(l, S.wk, true, P.ink, S.wkL)); }
  const ms = ids.map(id => DB.memo(id)).filter(m => m && !m.deletedAt && m.text);
  ms.forEach(m => {
    font(S.mm, false); const ls = wrapText(x, wallLine(m), max - 44, 3), need = (y ? S.gap : 0) + ls.length * S.mmL;
    if (dropped || y + need > room){ dropped++; return; }
    if (y) y += S.gap; ops.push({ dot:true, y:y + Math.round(S.mmL / 2) });
    ls.forEach(l => line(l, S.mm, false, P.ink, S.mmL, L + 44)); used++; });
  x.fillStyle = P.bg; x.fillRect(0, 0, W, H);
  const oy = ph ? top : top + Math.max(0, Math.round((room - y) / 2));
  ops.forEach(o => { if (o.dot){ x.fillStyle = P.sub; x.beginPath(); x.arc(L + 10, oy + o.y, ph ? 9 : 8, 0, Math.PI * 2); x.fill(); return; }
    font(o.px, o.b); x.fillStyle = o.col; x.textAlign = 'left'; x.fillText(o.t, o.X, oy + o.y); });
  if (ops.length){ font(ph ? 30 : 26, false); x.fillStyle = P.sub; x.textAlign = ph ? 'center' : 'left'; x.fillText('오션아워', ph ? W / 2 : L, ph ? H - 190 : oy + y + 90); }

}
const blobOf = url => { const b = atob(url.split(',')[1]), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Blob([u], { type:'image/png' }); };   // 누른 그 자리에서 — 아이폰은 기다리면 보내기 창을 막는다

    ['(\\d{1,2})일?\\s*[-~]\\s*(\\d{1,2})일', m => { const a = dom(+m[1]); return a ? span(a, +a.slice(5, 7), +m[2]) : null; }],
    ['(\\d{1,2})월\\s*(\\d{1,2})일', m => { const a = md(+m[1], +m[2]); return a ? { date:a } : null; }],
    ['(\\d{1,2})[/.](\\d{1,2})', m => { const a = md(+m[1], +m[2]); return a ? { date:a } : null; }],
    ['(\\d{1,2})일', m => { const a = dom(+m[1]); return a ? { date:a } : null; }],
    ['오늘', () => ({ date:T })], ['내일', () => ({ date:S1(1) })], ['모레', () => ({ date:S1(2) })], ['글피', () => ({ date:S1(3) })],
    [W1, m => ({ date:dow(DAYS.indexOf(m[1] || m[2])) })],
    ['언젠가', () => ({ date:null })],
  ];
  let text = raw.trim(), got = {}, moved = true, keepHead = '', keepTail = '';   // keep — dateOnly일 때 글에 남기려고 떼어 둔 앞 · 뒤 낱말
  while (moved){ moved = false;
    for (const [src, fn] of RULES){
      for (const [hi, re] of [new RegExp(`^(?:${src})(?=\\s)`), new RegExp(`\\s(?:${src})$`)].entries()){
        const hay = hi === 0 ? text + keepTail : keepHead + text;      // dateOnly — 떼어 둔 낱말도 곁으로 셈에 넣는다(「내일」 하나만 남은 글도 뒤의 말과 이어 읽는다). 아니면 keep이 비어 text 그대로
        const m = hay.match(re); if (!m) continue;
        if (hi === 0 ? m[0].length > text.length : m.index < keepHead.length - 1) continue;   // 떼어 둔 낱말을 건드리는 맞음은 안 쓴다
        const r = fn(m); if (!r) continue;
        const rest = hi === 0 ? text.slice(m[0].length).trim() : hay.slice(0, m.index).slice(keepHead.length).trim();
        if (dateOnly && (r.rep || r.time || r.deadline || r.goal || r.end || r.dur)){   // 날짜 아닌 낱말은 글에 남긴다 — 떼어 두고 끝에 도로 붙인다(남은 낱말이 날짜로 읽히지 않게)
          if (!rest) continue;
          if (hi === 0) keepHead += m[0] + ' '; else keepTail = m[0] + keepTail;
          text = rest; moved = true; break; }
        if ((r.rep && got.rep) || ('date' in r && 'date' in got) || (r.time && got.time) || (r.deadline && got.deadline) || (r.goal && got.goal)) continue;   // 같은 종류는 한 번만
        if (!rest && !(dateOnly && (keepHead + keepTail).trim())) continue;       // 글이 다 없어지면 알아듣지 않는다 — 남겨 둔 낱말이 글이 되면 된다
        Object.assign(got, r); text = rest; moved = true; break;
      }
      if (moved) break;
    }
  }
  if (!got.rep && !('date' in got) && !got.time && !got.deadline && !got.goal) return null;
  if (got.dlWeekly && got.date) while (got.deadline < got.date) got.deadline = DB.shift(got.deadline, 7);   // 「내일 … 금요일까지」 — 할 날 이후의 금요일
  if (got.rep && !('date' in got)){               // 반복만 있으면 첫 날은 규칙대로. 요일 · 날이 안 정해진 규칙은 오늘부터
    const r = got.rep, open = r.every === 'day' || r.every === 'days' || r.every === 'times' || (r.every === 'year' && !r.mon) || (r.every === 'week' && r.dow == null);
    got.date = open ? T : DB.nextDate(r, T); }
  if (got.rep && got.rep.every === 'week' && got.date) got.rep.dow = new Date(got.date + 'T00:00:00').getDay();
  if (got.rep && got.rep.every === 'year' && !got.rep.mon && got.date){ got.rep.mon = +got.date.slice(5, 7); got.rep.dom = +got.date.slice(8); }
  const has = 'date' in got;
  const when = !has ? '' : got.date === null ? '날짜 없음'
    : (got.date.slice(0, 4) !== T.slice(0, 4) ? got.date.slice(0, 4) + '년 ' : '')
      + (got.date === T ? '오늘' : got.date === S1(1) ? '내일' : dOnly(got.date)) + ' ' + weekday(got.date);
  const endT = got.time && got.dur ? hm(Math.floor((toM(got.time) + got.dur) / 60) % 24, (toM(got.time) + got.dur) % 60) : null;
  const label = [when + (got.end ? '~' + dOnly(got.end) : ''), got.time ? fmtTime(got.time) + (endT ? '~' + fmtTime(endT) : '') : '',
                 got.rep ? '↻ ' + repText(got.rep) : '', got.deadline ? dOnly(got.deadline) + '까지' : '', got.goal ? '하루 ' + got.goal + '번' : ''].filter(Boolean).join(' · ');
  return { text: dateOnly ? [keepHead, text, keepTail].map(x => x.trim()).filter(Boolean).join(' ') : text, date: has ? got.date : undefined, end: got.end || null, deadline: got.deadline || null, goal: got.goal || null, time: got.time || null, dur: got.dur || null, rep:got.rep || null, when, label };
}

/* ── 내보내기 알림 ── 자료를 잃는 게 이 시장의 1번 사인이다(2일차-리뷰-읽기.md). 내보낸 뒤로 바뀐 게 있고
   이레가 지났으면 위에 띠로 알린다. 내보낸 때는 이 브라우저 것이라 자료가 아니라 따로 둔다 */
const BK = DB.key + '.backup', BACKUP_DAYS = 7;
const readBK = () => { try{ return JSON.parse(localStorage.getItem(BK)) || {}; }catch(e){ return {}; } };
const writeBK = patch => { try{ localStorage.setItem(BK, JSON.stringify({ ...readBK(), ...patch })); }catch(e){} };
function backupDue(){
  const T = DB.today(), b = readBK(); if (b.later && b.later > T) return null;
  let last = '', first = '';
  for (const t of DB.todos()){ if (t.updatedAt > last) last = t.updatedAt; if (t.made && (!first || t.made < first)) first = t.made; }
  for (const l of DB.lists()) if (l.updatedAt > last) last = l.updatedAt;
  for (const m of DB.memos()){ if (m.updatedAt > last) last = m.updatedAt; const d = DB.madeDay(m); if (d && (!first || d < first)) first = d; }   // 메모만 적는 사람도 — 메모의 made 는 시각까지라 날짜로 바꿔 견준다
  if (!last || (b.at && b.at >= last)) return null;            // 내보낸 뒤로 바뀐 게 없다
  const since = b.at ? DB.ymd(new Date(b.at)) : first; if (!since) return null;
  const days = -ddays(since, T); return days >= BACKUP_DAYS ? { days, never:!b.at } : null;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-backup]'); if (!b) return;
  if (b.dataset.backup === 'now') $('#out').click(); else { writeBK({ later:DB.shift(DB.today(), BACKUP_DAYS) }); render(); } });

/* ── 폰에서 잃는 길 둘(규칙 1) ── 앱 안 브라우저(인스타 · 카톡 · 페북 · 네이버 · 라인 …)의 자료는 사파리 · 크롬과 따로 있고, 그 앱이 지울 수도 있다.
   아이폰 사파리는 사파리를 쓴 날로 이레 동안 안 연 사이트의 저장을 지운다 — 홈 화면에 추가한 앱은 안 지운다(WebKit 블로그 2020-03) */
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER\(inapp|Line\/|DaumApps|Threads|everytimeApp|Snapchat/i;
function phoneRisk(ua = navigator.userAgent, alone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true){
  if (IN_APP.test(ua)) return 'inapp';
  const iSafari = /iPhone|iPad|iPod/.test(ua) && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  if (iSafari && !alone && (DB.todos().length || DB.memos().length) && !((readBK().homeLater || '') > DB.today())) return 'home';
  return null;
}
function riskHTML(k){
  if (k === 'inapp') return `앱 안 브라우저에서 열었습니다. 여기 적은 것은 사파리 · 크롬에서 안 보이고, 이 앱이 지울 수도 있습니다.
      인스타 · 카톡 화면의 ⋯ 메뉴에서 「브라우저로 열기」를 누르거나 주소를 복사해 사파리 · 크롬에서 열어 주세요.<button data-risk="copy">주소 복사</button>`
    + (/Android/i.test(navigator.userAgent) ? `<a class="rb" href="intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end">크롬으로 열기</a>` : '');
  return `아이폰 사파리는 이레 동안 안 연 사이트의 자료를 지울 수 있습니다. 공유 단추 → 「홈 화면에 추가」로 설치해 쓰면 지우지 않습니다.<button data-risk="later">일주일 뒤에</button>`;
}

}

/* ── 만료된 집중 정산 ── 집중 화면은 덜어냈지만 옛 자료에는 「끝나는 시각(runEnd)」이 지난 run이 남아 있을 수 있다.
   그대로 두면 그 할 일에 붙은 메모(link k:'t')가 계속 떠 있다(DB.linkShowing이 run을 본다). 끝나는 시각까지만 쓴 것으로 DB.stopRun이 끝낸다.
   부르는 때: 시작 · 자료를 다시 읽을 때(storage · 가져오기) · 20초 주기(alarmTick). 끝나는 시각 없이 돌던 run은 건드리지 않는다 */
function settleRun(){
  let n = 0;
  for (let r = DB.running(); r && r.runEnd && Date.parse(r.runEnd) < Date.now() && DB.stopRun(r.id); r = DB.running()) n++;
  return n;
}

/* ── 알림 ── 정한 시각의 몇 분 전부터 뜨는 메모를 알린다(뜨기 시작할 때 한 번). 브라우저 알림은 허락했을 때만, 이 탭이 열려 있을 때만 온다.
   허락은 평소에 묻지 않는다 — 시각을 정해 처음 적을 때 한 번만(offerNotifyMemo) */
function alarmTick(first){
  settleRun();
  const now = new Date();
  const n = now.getTime();                       // 메모 — 정한 시각의 몇 분 전, 뜨기 시작할 때 한 번(09-27). 알림은 잠금화면에도 뜬다 — 실마리만인 메모는 실마리만(규칙 7)
  DB.memos().forEach(m => { if (!m.show || m.show.kind !== 'at') return;
    const w = DB.atWin(m), k = m.id + '@' + m.show.at + '-' + m.show.lead; if (rung.has(k) || w[0] > n) return;   // 중간에 한 번은 알림 없이 — 조용한 자리에만(규칙 3)
    rung.add(k);
    if (first || n - w[0] > 3 * 60e3 || n >= w[1]) return;   // 열기 전에 지난 것은 조용히 넘긴다
    const txt = m.text ? (m.clue ? clueOf(m.text) + '…' : m.text) : '감정 기록';
    const msg = `${fmtTime(m.show.at.slice(11))}${m.show.lead ? ` (${m.show.lead === 60 ? '1시간' : m.show.lead + '분'} 뒤)` : ''} · ${txt}`;
    toast('메모 · ' + msg, null, 15000);
    if ('Notification' in window && Notification.permission === 'granted')
      try{ new Notification('오션아워', { body:msg, tag:k }); }catch(err){}
  });
  const key = DB.shownMemos().map(m => m.id).join(',');   // 때가 되면 뜨고, 지나면 내려온다 — 떠 있는 것이 바뀌면 다시 그린다
  if (key !== upKey){ const a = document.activeElement, busy = editing() || (a && a.closest && a.closest('#mopts, .mtools, #wline'));
    if (!first && !busy) render(); if (!busy) upKey = key; }
}
alarmTick(true); setInterval(() => alarmTick(false), 20000);

/* ── 날이 바뀌면 ── 켜 둔 채 자정을 넘겨도 「오늘」이 어제에 머물지 않게 */
let shown = DB.today();
function dayTick(){
  const T = DB.today(); if (T === shown) return;
  DB.rollTimes();
  shown = T;
  if (!editing()) render();
}
setInterval(dayTick, 30000);
addEventListener('focus', dayTick);
document.addEventListener('visibilitychange', dayTick);

/* ── 연 횟수 ── 이 기기 안에서만 센다(규칙 8). 5분 넘게 떠나 있다가 돌아오면 한 번. 새로 고침은 안 센다.
   떠난 때는 이 브라우저 것이라 자료가 아니라 따로 둔다 */
const SEEN = DB.key + '.seen', AWAY = 5 * 60e3;
let awayAt = null;
function noteAway(){ if (awayAt === null) awayAt = Date.now(); try{ localStorage.setItem(SEEN, String(Date.now())); }catch(e){} }
function noteBack(){
  if (document.visibilityState !== 'visible') return;
  if (awayAt !== null && Date.now() - awayAt >= AWAY){ pingWeek(); DB.countOpen(); }
  awayAt = null;
}
addEventListener('blur', noteAway); addEventListener('pagehide', noteAway); addEventListener('focus', noteBack);
document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' ? noteAway() : noteBack());

/* ── 재는 길(규칙 8·9, C판) ── 이번 주 처음 온 기기인지 · 다시 온 기기인지만, 이름 없이 Cloudflare에 판정 결과를 알린다.
   적은 내용(할 일 · 메모) · 체류 시간은 절대 안 보낸다 — 숨은 창(iframe)에 빈 페이지(Cloudflare 스니펫만)를 3초만 띄우고 지운다.
   「진짜 첫 기기인가」는 DB.countOpen()으로 이번 열람이 opens에 더해지기 전에 판정한다 — 그 뒤엔 opens가 안 비어 있어 못 가른다.
   D3 — navigator.onLine이 false면 판정 자체를 안 한다(가드도 안 남긴다). 다음 열람 때 다시 판정하면 되므로 자료 손실이 아니다.
   창 격리(C판) — 다시 2회차 땐 핑 페이지가 앱과 같은 주소(app/back.html)라 sandbox="allow-scripts"(allow-same-origin 없음)로
   오파크 출처를 만들어 막았는데, 그러면 Cloudflare 예비 요청(OPTIONS)의 origin이 'null'이 되어 등록된 도메인과 안 맞아
   404로 막혀 배포해도 못 쟀다(검증 (라) 확인). 그래서 핑 페이지 자체를 앱과 다른 주소(oceanhour-ping.pages.dev)로 옮겼다 —
   이제는 애초에 다른 출처라, sandbox 없이도 이 창의 부모(이 문서)도 이 창 안 스크립트도 서로의 localStorage · IndexedDB에
   못 닿는다(같은 이유로 sw.js도 이 주소의 요청을 아예 안 본다 — origin이 달라 fetch 이벤트 자체가 안 걸린다).
   그래도 sandbox="allow-scripts allow-same-origin"은 그대로 준다 — allow-same-origin은 이 창에 제 origin(oceanhour-ping.pages.dev)을
   주는 것뿐이라 예비 요청은 그 도메인으로 나가 200이 되고(관리 curl 확인), 대신 allow-top-navigation·allow-popups를 안 줘서
   Cloudflare 비콘 스크립트가 변조되더라도 이 창이 부모 페이지를 옮기거나 팝업을 띄우진 못한다(cso, 덤 방어). */
const PING_KEY = DB.key + '.pingedWk';
const PING_HOST = 'https://oceanhour-ping.pages.dev';                // 핑 페이지 전용 주소 — 앱과 다른 출처라 앱 storage에 못 닿는다
const wkOpens = wk => [0, 1, 2, 3, 4, 5, 6].reduce((a, i) => a + DB.opensOn(DB.shift(wk, i)), 0);
function pingFrame(src){
  const f = document.createElement('iframe');
  f.referrerPolicy = 'no-referrer';                                 // cso — 이거 없으면 앱 주소(쿼리 포함)가 핑 페이지의 document.referrer로 샌다
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin');      // C판 — 위 주석 참고. 저장소 격리는 다른 출처가 하고, sandbox는 top-navigation·팝업만 막는다
  f.src = src; f.setAttribute('data-ping', '1'); f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 3000);
}
function pingWeek(){
  if (!navigator.onLine) return;                                    // D3 — 오프라인이면 안 쏜다
  const wk = DB.monday(DB.today());
  let last = ''; try{ last = localStorage.getItem(PING_KEY) || ''; }catch(e){}
  if (last === wk) return;                                          // 이번 주엔 이미 판정했다(가드)
  const had = DB.everOpened();                                      // 세기 전 상태 — 진짜 첫 기기인지
  try{ localStorage.setItem(PING_KEY, wk); }catch(e){}
  if (!had) return pingFrame(PING_HOST + '/new');
  if (wkOpens(DB.shift(wk, -7)) > 0) return pingFrame(PING_HOST + '/back');
  // 이번 주 첫 기기지만 지난주 기록이 없다 — 아무것도 안 쏜다
}

/* ── 다른 탭 ── 같은 앱을 탭 둘로 열어도 한쪽에서 적은 것이 지워지지 않게 */
addEventListener('storage', e => {
  if (e.key !== null && e.key !== DB.key) return;
  DB.load(); settleRun(); if (!editing()) render();
});

/* ── 설치해서 쓰기 ── 인터넷 주소(또는 localhost)로 열었을 때만. 파일로 열면(file://) 설치가 안 된다
   크롬·엣지는 「앱으로 설치」 단추가 뜬다. 사파리는 공유 → 「Dock에 추가」·「홈 화면에 추가」로 설치한다 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
  navigator.serviceWorker.register('./sw.js').catch(() => {});
let installAsk = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installAsk = e; $('#install').classList.remove('hide'); });
window.addEventListener('appinstalled', () => { installAsk = null; $('#install').classList.add('hide'); toast('설치했습니다 — 이제 앱처럼 따로 열 수 있습니다'); });
$('#install').addEventListener('click', async () => { if (!installAsk) return;
  installAsk.prompt(); const r = await installAsk.userChoice.catch(() => null); installAsk = null;
  if (!r || r.outcome !== 'accepted') $('#install').classList.add('hide'); });

/* ── 앱 밖에서 들어오기(채점 15판 S18) ── 안드로이드에 설치한 웹 앱은 다른 앱의 「공유 → 오션아워」로 글이 오고(share_target),
   아이콘을 길게 누르면 바로가기(shortcuts — 메모 적기 · 할 일 적기)로 온다(옛 달력 · 한 주 바로가기는 메모 화면으로). 공유받은 글은 입력칸에 넣어 두기만 한다 — Enter로 넣는다(모르는 새 줄을 저절로 만들지 않는다) */
function takeLaunch(u){
  const gc = hashCode([u.get('title'), u.get('text'), u.get('url')].join(' '));   // 공유받은 것이 받은 링크면 — 자르기 전에 본다(링크가 길다)
  if (gc && DB.giftOf(gc)){ history.replaceState(null, '', location.pathname); return takeGift(gc); }
  const go = u.get('go'), txt = [u.get('title'), u.get('text'), u.get('url')].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim().slice(0, 300);
  if (!go && !txt) return false;
  history.replaceState(null, '', location.pathname);
  if (go === 'memo' || go === 'cal' || go === 'week' || (txt && go !== 'add')){   // 옛 바로가기(?go=cal · ?go=week)는 달력 · 한 주가 없으니 메모 화면으로   // 공유받은 글 · 메모 바로가기는 메모 칸으로 — 적어 두기만 한다(09-27, 메모가 앞)
    page = 'memo'; q = ''; render(); const m = $('#memoIn');
    if (txt){ m.value = txt; fitMemoIn(); drawMopts(); toast('공유받은 글을 메모 칸에 넣었습니다 — Enter로 적힙니다'); }
    m.focus(); return true; }
  page = 'day'; q = ''; render();
  const i = $('#add'); if (txt){ i.value = txt; i.dispatchEvent(new Event('input', { bubbles:true })); toast('공유받은 글을 입력칸에 넣었습니다 — Enter로 할 일이 됩니다'); }
  i.focus(); return true;
}

render();
focusEntry();                                   // 연 자리가 곧 적는 자리(규칙 2) — 메모 화면이면 메모 칸
$('#fb').href = fbLink();
takeLaunch(new URLSearchParams(location.search));
{ const c = hashCode(location.hash); if (c) takeGift(c); }   // 받은 링크(#g=)로 열었으면
{ let s = 0; try{ s = +localStorage.getItem(SEEN) || 0; }catch(e){}   // 첫 화면을 그린 뒤에 센다 — 여는 빠르기(규칙 2)를 안 늦춘다
  if (Date.now() - s >= AWAY) setTimeout(() => { pingWeek(); DB.countOpen(); }, 0); }
</script>
</body>
