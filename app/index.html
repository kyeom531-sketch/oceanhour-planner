<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오션아워</title>
<meta name="description" content="흩어진 할 일 · 일정 · 목표를 한 곳에. 하루를 정한 곳에 썼는지까지 보여 줍니다. 나무도, 순위도, 연속 기록도 없이.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-title" content="오션아워">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 글자는 --d70 까지만 흐리게 한다 (흰 바탕 대비 5.2, 옆 칸 바탕 4.8). --d32 는 입력칸 안 빈칸 안내에만 쓴다 — 누르는 글자에 쓰면 4.5가 안 된다(10판에서 잼) */
:root{
  --bg:#F6F4F1; --card:#FFF; --side:#F1EEEA; --line:rgba(40,38,35,.09);
  --ink:#2E2C29; --d70:rgba(46,44,41,.7); --d32:rgba(46,44,41,.32); --hov:rgba(46,44,41,.05);
  --c1:#A8415A; --c2:#8E6524; --c3:#3B6846; --c4:#2C5B88; --c5:#6B6762;
  --red:#C23A30;   /* 공휴일 · 일요일 — 흰 바탕 대비 5.3 */
  --r:10px;
  --off:#CFC8BF; --warn-bg:#FAF0DC; --warn-ink:#8E6524;   /* 그 밖 막대 · 알림 띠 */
  color-scheme:light dark;
}
/* 어두운 화면 — 기기 설정을 따른다(설정 칸은 안 만든다). 09-26 진리로 다시 판단: 상위 12개 중 7개가 테마를 적었고,
   1억을 번 노션 OS가 어두운 판이다. 밤에 폰으로 저녁 마무리를 한다. 글자 대비는 밝은 판과 같이 4.5를 넘긴다 */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1B1A18; --card:#252321; --side:#201F1D; --line:rgba(236,232,226,.1);
    --ink:#ECE8E2; --d70:rgba(236,232,226,.7); --d32:rgba(236,232,226,.34); --hov:rgba(236,232,226,.07);
    --c1:#D98A9E; --c2:#CFA566; --c3:#7DB38B; --c4:#7EA8D8; --c5:#B3AEA7; --red:#E8776C;
    --off:#57524C; --warn-bg:#3A3020; --warn-ink:#E3C27F;
  }
  .dot,.gdot,.cdot:not(.none){filter:brightness(1.5) saturate(.85)}   /* 목표 색은 자료에 적힌 값이라 점만 밝힌다 */
}
/* 테마(09-26) — 무료 다섯 벌. 바탕 · 옆 칸 · 강조색만 바꾼다. 어두운 화면에서는 강조색만. 글자 대비는 다섯 다 5 넘는다(검사.js)
   근거 ③ — 앱스토어 14개 중 5개가 테마를 적었고 아치캘린더가 09-19 폰에도 넣었다. 이 다섯은 무료로 둔다(규칙 6) */
@media (prefers-color-scheme:light){
  :root[data-theme=forest]{--bg:#F1F4EF;--side:#E8EDE5;--c4:#2F6B45}
  :root[data-theme=lavender]{--bg:#F5F3F8;--side:#EDE9F3;--c4:#5A4796}
  :root[data-theme=peach]{--bg:#FAF3F0;--side:#F7F0ED;--c4:#A23E5A}
  :root[data-theme=ink]{--bg:#F4F4F3;--side:#EBEBE9;--c4:#3D3D3D}
}
@media (prefers-color-scheme:dark){
  :root[data-theme=forest]{--c4:#86C39B}
  :root[data-theme=lavender]{--c4:#B3A4E8}
  :root[data-theme=peach]{--c4:#E595AA}
  :root[data-theme=ink]{--c4:#CFCFCF}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  display:flex;height:100vh;overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0}
input,select{border:0;outline:0;background:transparent}

/* ── 사이드바 ── */
aside{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.brand{padding:13px 14px 9px;font-weight:700;font-size:14.5px;letter-spacing:-.02em}
.find{margin:0 10px 8px;display:flex;align-items:center;gap:6px;background:var(--card);
  border-radius:8px;padding:5px 9px}
.find input{flex:1;min-width:0;font-size:13px}
.find .x{color:var(--d70);font-size:15px;line-height:1;flex:none}
.sec{font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--d70);padding:10px 6px 4px}
.lists{flex:1;overflow:auto;padding:0 8px}
.li{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  color:var(--d70);padding:5px 6px;border-radius:7px;font-size:13.5px}
.li:hover{background:var(--hov)}
.li.on{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font-weight:700}
.li .dot{width:7px;height:7px;border-radius:50%;flex:none}
.li .dot.ring{box-shadow:inset 0 0 0 1.4px var(--d70)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.fin .nm{text-decoration:line-through}
.li .n{font-size:11.5px;color:var(--d70);flex:none}
.li .dd,.daybar .dd{font-size:11px;color:var(--d70);flex:none;font-variant-numeric:tabular-nums}
.li .dd.near,.daybar .dd.near{color:var(--red)}
.li .del{opacity:0;color:var(--d70);font-size:14px;flex:none;line-height:1}
.li:hover .del{opacity:1}
.li .del:hover{color:var(--c1)}
.newlist{color:var(--d70);font-size:13px;padding:5px 6px;width:100%;text-align:left;border-radius:7px}
.newlist:hover{background:var(--hov);color:var(--ink)}
.lists .edit{display:block;margin:2px 0;padding:4px 6px;font-size:13.5px}
/* 시간 재기 — 지금 도는 것은 어느 화면에서든 옆 칸 아래에 보인다 */
.runbar{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:7px;align-items:center;font-size:12.5px}
.runbar .rdot{width:7px;height:7px;border-radius:50%;background:var(--c3);flex:none}
.runbar .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbar .rt{color:var(--d70);font-variant-numeric:tabular-nums;flex:none}
.runbar button{font-size:11.5px;color:var(--d70);border:1px solid var(--line);padding:2px 7px;border-radius:6px;flex:none}
.runbar button:hover{background:var(--card);color:var(--ink)}
.runbar .rt.focus{color:var(--ink)}
.meta .d.run{color:var(--c3);font-weight:600;font-variant-numeric:tabular-nums}
.meta .d.tm{color:var(--c4);font-weight:600;cursor:pointer}
.tpick,.epick{position:absolute;right:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
/* 여러 날에 걸친 일 — 월 달력에서는 칸을 이어 막대로 */
.cl.span{background:color-mix(in srgb,var(--sc) 22%,var(--card));margin:0 -6px;padding:0 6px;border-radius:0;min-height:16px}
.cl.span.s{margin-left:0;border-radius:4px 0 0 4px}
.cl.span.e{margin-right:0;border-radius:0 4px 4px 0}
.cl.span.s.e{border-radius:4px}
.cl.span.done{color:var(--d70)}
.meta .dl.near{color:var(--red)}
.carry.over{color:var(--ink)}
.lline{font-size:12.5px;color:var(--ink);padding:0 0 6px 4px}
#one .flist{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;max-height:46vh;overflow:auto}
#one .fi{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 9px;border-radius:8px;border:1px solid var(--line);font-size:13.5px}
#one .fi::before{content:'';width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--ink) 40%,transparent);flex:none}
#one .fi.on{background:color-mix(in srgb,var(--c4) 7%,transparent);border-color:color-mix(in srgb,var(--c4) 35%,transparent)}
#one .fi.on::before{background:var(--c4);box-shadow:none}
#one .fi .fd{margin-left:auto;font-size:11.5px;color:var(--d70);flex:none}
#one .fi.ro::before{display:none}
#one .fadd{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;margin-bottom:10px}
#one textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;margin-bottom:10px;resize:vertical}
#one .fnext{display:flex;justify-content:flex-end;gap:6px}
#one .fnext button{font-size:13.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--line)}
#one .fnext button.main{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* 한 장씩 — 지난 일 정리 · 아침 계획 · 저녁 마무리가 같이 쓰는 판 */
#one{position:fixed;inset:0;z-index:55;background:rgba(40,38,35,.28);display:flex;align-items:center;justify-content:center;padding:16px}
#one .card{background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(40,38,35,.25);width:min(460px,100%);max-height:88vh;overflow:auto;padding:18px 18px 14px}
#one .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--d70);margin-bottom:10px}
#one .top button{font-size:12px;color:var(--d70);padding:2px 6px;border-radius:6px}
#one .big{font-size:18px;font-weight:600;line-height:1.35;margin:4px 0 6px;overflow-wrap:anywhere}
#one .sub{font-size:12.5px;color:var(--d70);margin-bottom:14px}
#one .hint{font-size:12px;line-height:1.5;color:var(--d70);margin:-8px 0 14px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--c4) 7%,transparent);white-space:normal;overflow-wrap:anywhere}
#one .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#one .acts button{font-size:13.5px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
#one .acts button.main{background:var(--ink);color:var(--card);border-color:var(--ink)}
#one .acts button.del{color:var(--c1)}
#one .foot{display:flex;justify-content:space-between;margin-top:10px}
#one .foot button{font-size:12px;color:var(--d70);padding:3px 6px;border-radius:6px}
#one .foot button:disabled{opacity:.4}
/* 스와이프 — 오른쪽은 끝내기, 왼쪽은 내일로 */
li.row[data-t]{touch-action:pan-y}
li.row[data-sw]{transition:none;border-radius:6px}
li.row[data-sw=done]{background:rgba(59,104,70,.14)}
li.row[data-sw=later]{background:color-mix(in srgb,var(--c4) 12%,transparent)}
li.row.swback{transition:transform .15s ease}
/* 쉬기 · 집중 화면 */
.runbar .rdot.brk{background:var(--c4)}
#big{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#big .bg-l{font-size:14px;color:var(--d70)}
#big .bg-t{font-size:20px;font-weight:600;text-align:center;max-width:90vw}
#big .bg-n{font-size:clamp(64px,18vw,160px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
#big .bg-b{display:flex;gap:8px}
#big .bg-b button{font-size:14px;padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.tallyb{font-size:11.5px;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.tallyb:hover{border-color:var(--c3)}
.tallyb.full{background:var(--c3);border-color:var(--c3);color:var(--card)}
.wkg{display:inline-flex;gap:2px;align-items:center}
.wkg i{width:6px;height:6px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.wkg i.on{background:var(--c3)}
.wkg i.td{box-shadow:0 0 0 1px var(--ink)}
/* 복사 — 날짜 칩 */
.copyp{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 0 4px 23px}
.box > .copyp{padding:10px 12px}
.cp-l{font-size:12px;color:var(--d70);margin-right:2px}
.cp{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cp.red{color:var(--red)}
.cp.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cp.more{position:relative;color:var(--d70)}
.cp.more input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cp-act{display:flex;gap:5px;margin-left:auto}
.cp-act button{font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--d70)}
.cp-act button.on{background:var(--c4);border-color:var(--c4);color:var(--card)}
.cp-act button:disabled{opacity:.5;cursor:default}
/* 여러 개 골라 한꺼번에 */
body.picking li.row[data-t]{cursor:pointer;user-select:none}
body.picking li.row[data-t] .ck,body.picking li.row[data-t] .tools,body.picking li.row[data-t] .grip{display:none}
.pk{width:15px;height:15px;margin-top:2px;border-radius:50%;box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--ink) 45%,transparent);flex:none}
li.row.picked{background:color-mix(in srgb,var(--c4) 7%,transparent);border-radius:6px}
li.row.picked .pk{background:var(--c4);box-shadow:none}
#pickbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:0 6px 24px rgba(40,38,35,.18),0 0 0 1px var(--line);max-width:94vw}
#pickbar .pn{font-size:13px;font-weight:600;padding:0 6px}
#pickbar button,#pickbar .pksel{font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--ink);background:var(--card)}
#pickbar button:disabled{opacity:.45}
#pickbar .del{color:var(--c1)}
#pickbar .pkd{position:relative}
#pickbar .pkd input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* 분류 색 — 목표 화면 제목 앞 점을 누르면 다섯 색이 나온다 */
.daybar .gdot.pick{padding:0;border-radius:50%;width:12px;height:12px;cursor:pointer}
.area-l{margin-left:6px;display:inline-flex;align-items:center;gap:5px}
.area-in{width:92px;font-size:13px;color:var(--ink);border-bottom:1px dashed color-mix(in srgb,var(--ink) 35%,transparent);padding:1px 2px}
.area-in::placeholder{color:var(--d70)}
.sec.area span{cursor:text}
.sec.area span:hover{color:var(--ink)}
.sw{display:inline-flex;gap:10px;padding:4px 8px;background:var(--card);border-radius:999px;box-shadow:0 1px 4px rgba(40,38,35,.12)}
.daybar .sw button{width:15px;height:15px;border-radius:50%;padding:0}
.daybar .sw button.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.keep{border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:6px;align-items:center}
.keep .t{font-size:11px;color:var(--d70);flex:1;min-width:0}
.keep button{font-size:11.5px;color:var(--d70);border:1px solid var(--line);
  padding:3px 8px;border-radius:6px;flex:none}
.keep button:hover{background:var(--card);color:var(--ink)}
.meta .back{font-size:11.5px;color:var(--c4);padding:1px 6px;border-radius:5px;white-space:nowrap}
.meta .back:hover{background:var(--hov)}
#install{color:var(--c4)}

/* ── 본문 ── */
main{flex:1;overflow:auto}
#warn{display:none;background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;padding:8px 18px}
#warn.on{display:block}
#warn button{font-size:12px;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 35%,transparent);border-radius:6px;padding:1px 8px;margin-left:8px;background:transparent}
#warn button:hover{background:color-mix(in srgb,var(--warn-ink) 8%,transparent)}
#warn a.rb{font-size:12px;color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 35%,transparent);border-radius:6px;padding:1px 8px;margin-left:6px;text-decoration:none;white-space:nowrap}
.fb{display:block;font-size:11px;color:var(--d70);padding:0 12px 10px;text-decoration:none}
.fb:hover{color:var(--ink);text-decoration:underline}
.hbtn{text-align:left;width:100%;padding-top:10px;color:var(--c4)}
.thbtn{padding-top:0}
.themes{display:flex;gap:8px;padding:0 12px 10px}
.themes button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);position:relative;flex:none}
.themes button i{position:absolute;inset:7px;border-radius:50%}
.themes button.on{box-shadow:0 0 0 2px var(--ink)}
@media (pointer:coarse){ .themes{gap:10px} .themes button{width:34px;height:34px} .themes button i{inset:9px} .themes button::before{content:'';position:absolute;inset:-5px} }
/* 목표 묶음 머리는 목표 색 칩(규칙 12 — 잘 되는 앱은 목표 색을 크게 보인다). 밝은 판 · 어두운 판 둘 다 잉크와 섞어 읽힌다 */
.box h2.gh{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;margin:7px 0 4px;border-radius:999px;cursor:pointer;
  background:color-mix(in srgb,var(--gc) 13%,var(--card));color:color-mix(in srgb,var(--gc) 78%,var(--ink))}
.box h2.gh .gdot{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--gc) 30%,var(--card))}
/* 아이콘 — 이동에만(규칙 12). 글과 같이 */
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li .ico{width:16px;height:16px;color:var(--d70)}
.li.on .ico{color:var(--ink)}
/* 이렇게 쓸 수 있어요 */
.help table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 8px}
.help td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.help tr:first-child td{border-top:0}
.help td:first-child{width:46%;padding-right:10px}
.help td:last-child{color:var(--d70)}
.help .try{color:var(--c4);text-align:left;font-size:13.5px;padding:2px 0;display:inline-block;line-height:20px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c4) 35%,transparent);text-underline-offset:3px}
.help ul{margin:0 0 8px;padding:0 0 0 18px;font-size:13.5px;line-height:1.65}
.help ul span{color:var(--d70)}
.help kbd{font:inherit;font-size:12px;padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--hov)}
.fmore{margin:0 0 6px}
.fmore button{font-size:12.5px;color:var(--c4)}
/* 받은 틀 · 한 주 그림 */
.frame p{font-size:13px;color:var(--d70);margin:2px 0 8px}
.frame ul{margin:0 0 10px;padding:0 0 0 18px;font-size:13.5px;line-height:1.6}
.frame li span{display:block;font-size:12.5px;color:var(--d70)}
.frame .fwarn{color:var(--warn-ink)}
.fbtn{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 10px}
.fbtn button{font-size:13px;padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card)}
.fbtn button:first-child{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cardp .cimg{display:block;width:100%;max-width:360px;border-radius:8px;border:1px solid var(--line);margin:4px 0 10px}
.cnm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--d70);margin:0 0 8px}
.cardp .rnote{font-size:11px;color:var(--d70);padding:0 0 8px}
.wrap{max-width:820px;padding:16px 22px 70px;margin:0 auto}   /* 넓은 화면에서 가운데 — 1440에서 오른쪽 400px이 비었다(09-26 채점 2판) */
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:9px;position:relative}
.daybar h1{font-size:19px;margin:0;letter-spacing:-.025em}
.daybar .wd{font-size:13px;color:var(--d70)}
.daybar button{color:var(--d70);font-size:15px;padding:1px 6px;border-radius:6px;line-height:1.3}
.daybar button:hover{background:var(--hov);color:var(--ink)}
.daybar .today{font-size:12px;margin-left:4px;color:var(--c4)}
/* 늘 보이는 단추는 다섯까지(규칙 3) — 나머지는 「⋯」를 누르면 편다 */
.daybar .xtra{display:none}
.daybar.more-on .xtra{display:inline-block}
.daybar .dmore{font-size:14px;padding:1px 7px;letter-spacing:.05em}
.daybar.more-on .dmore{background:var(--hov);color:var(--ink)}
.daybar .dseg{background:transparent;padding:0;margin-left:4px}
.daybar .dseg button.on{display:none}
.daybar .seg.dseg button{font-size:12px;color:var(--c4);padding:1px 6px;border-radius:6px}
.daybar .seg.dseg button:hover{background:var(--hov)}
/* 컴퓨터는 날짜 줄을 다 편다(규칙 3 — 좁은 폰만 접는다) */
@media (min-width:641px){
  .daybar .xtra{display:inline-block}
  .daybar .dmore{display:none}
  .daybar .seg.dseg{background:var(--hov);padding:2px;border-radius:7px;margin-left:8px}
  .daybar .seg.dseg button{color:var(--d70);padding:2px 10px;border-radius:5px}
  .daybar .seg.dseg button.on{display:inline-block;background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(40,38,35,.08)}
}
.daybar .gdot{width:10px;height:10px}
.daybar .gn{cursor:text;border-radius:4px;padding:0 2px;margin:0 -2px}
.daybar .gn:hover{background:var(--hov)}
.daybar .due{color:var(--ink);font-size:13px;padding:1px 5px;line-height:1.45}
.daybar .nodue{font-size:14px;padding:0 4px}
.daybar .hol{color:var(--red)}
.daybar .holino{font-size:12px}
.daybar .ics{margin-left:auto;display:flex;gap:4px;align-items:center}
.daybar .ics button{font-size:12px;color:var(--d70);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.daybar .ics button:hover{background:var(--card);color:var(--ink)}
#dueIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}

.entry{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--r);
  padding:9px 12px;box-shadow:0 1px 2px rgba(40,38,35,.04);margin-bottom:10px}
.entry .p{color:var(--d70);flex:none;line-height:1}
.entry input{flex:1;min-width:0;font-size:14px}
.entry input::placeholder{color:var(--d32)}
.entry select{color:var(--d70);font-size:12.5px;flex:none;max-width:150px;cursor:pointer}
.entry{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;display:flex;flex-direction:column;padding:4px;
  background:var(--card);border-radius:var(--r);box-shadow:0 6px 18px rgba(40,38,35,.12),0 0 0 1px var(--line)}
.sug button{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px 6px 31px;border-radius:6px;font-size:14px;min-width:0}
.sug button.on,.sug button:hover{background:var(--hov)}
.sug .st{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .sl{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--d70)}
.sug .gdot{width:7px;height:7px}
.hint{flex:none;font-size:12px;color:var(--c4);background:color-mix(in srgb,var(--c4) 9%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hint:hover{background:color-mix(in srgb,var(--c4) 16%,transparent)}

.box{background:var(--card);border-radius:var(--r);padding:2px 12px;
  box-shadow:0 1px 2px rgba(40,38,35,.04);margin-bottom:10px}
.box h2{font-size:12px;font-weight:700;color:var(--d70);margin:0;padding:8px 0 4px;
  letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.box h2[data-list]{cursor:pointer}
.box h2[data-list]:hover{color:var(--ink)}
.gdot{width:7px;height:7px;border-radius:50%;flex:none}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 8px;padding:5px 0;
  border-top:1px solid var(--line);position:relative;min-width:0}
li.row:first-child{border-top:0}
/* 순서 — 줄 왼쪽 손잡이를 끌거나 Alt+↑↓. 키보드로 고른 줄은 연한 바탕 */
.grip{position:absolute;left:-12px;top:5px;width:10px;font-size:11px;line-height:18px;letter-spacing:-3px;white-space:nowrap;
  color:var(--d70);cursor:grab;opacity:0;user-select:none}
li.row:hover .grip{opacity:1}
.grip:hover{color:var(--ink)}
li.row.dragging{opacity:.4}
li.row.drop-before{box-shadow:inset 0 2px 0 var(--c4)}
li.row.drop-after{box-shadow:inset 0 -2px 0 var(--c4)}
li.row:focus{outline:none}
li.row:focus-visible{background:var(--hov);border-radius:4px;box-shadow:inset 2px 0 0 var(--c4)}
.ck{width:15px;height:15px;margin-top:2px;border:1.4px solid color-mix(in srgb,var(--ink) 55%,transparent);
  border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center}
.ck:hover{border-color:var(--ink)}
.ck.on{background:var(--c3);border-color:var(--c3)}
.play{flex:none;position:relative;width:20px;height:20px;border-radius:50%;font-size:8.5px;line-height:20px;text-align:center;padding-left:1px;
  color:var(--c4);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--c4) 45%,transparent)}
.play:hover{background:color-mix(in srgb,var(--c4) 12%,transparent)}
/* 마우스 화면도 누르는 자리 24px(11판, WCAG 2.5.8) — 도구를 펼치면 ▶ · ⋯ 곁에 단추가 붙어 간격으로도 모자랐다 */
.meta .more{position:relative}
.play::after,.meta .more::after{content:'';position:absolute;inset:min(0px,calc(50% - 12px))}
.tabs{display:none}
/* 손가락으로 쓸 때(폰 · 태블릿) — 누르는 자리 44px(애플) · 입력칸 16px(아이폰은 작으면 확대한다). 보이는 크기는 거의 그대로 */
@media (pointer:coarse){
  input,select,textarea{font-size:16px!important}
  li.row{padding-top:10px;padding-bottom:10px;min-height:44px}
  .ck{position:relative}
  .ck::before{content:'';position:absolute;inset:-14px -10px -14px -14px}
  .cdot select{inset:-18px -10px -18px -12px;width:auto;height:auto}
  .play::before{content:'';position:absolute;inset:-12px}
  .daybar.dayb > button,.daybar.dayb .seg button{min-height:40px}
  .daybar [data-go],.daybar .dmore{min-width:32px}
}
@keyframes ckpop{0%{transform:scale(.7)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.ck.pop{animation:ckpop .24s ease-out}
@media (prefers-reduced-motion:reduce){.ck.pop{animation:none}}
.ck.on::after{content:'';width:4px;height:7.5px;border:solid var(--card);border-width:0 1.6px 1.6px 0;
  transform:rotate(43deg) translate(-.5px,-1px)}
.tx{flex:1;min-width:0;cursor:text;border-radius:4px;padding:0 2px;margin:0 -2px}
.tx:hover{background:var(--hov)}
li.done .tx{color:var(--d70);text-decoration:line-through}
li.stage.cur .tx{font-weight:600}
.meta{display:flex;align-items:center;gap:7px;flex:none;min-height:20px;position:relative}
.meta .d{font-size:11.5px;color:var(--d70);white-space:nowrap}
.now{font-size:11px;color:var(--c4);background:color-mix(in srgb,var(--c4) 9%,transparent);padding:1px 7px;border-radius:999px;white-space:nowrap}
.cdot{width:8px;height:8px;border-radius:50%;flex:none;position:relative;cursor:pointer}
.cdot.none{box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--ink) 45%,transparent)}
.cdot select{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:16px;height:16px}
/* 줄 도구는 날짜·분류 점의 왼쪽에 뜬다. 점을 덮으면 점을 누른 것이 「지움」이 된다 */
.tools{position:absolute;right:100%;top:50%;transform:translateY(-50%);display:flex;gap:2px;
  opacity:0;pointer-events:none;background:var(--card);padding:0 4px 0 8px}
li.row:hover .tools,li.row:focus-within .tools{opacity:1;pointer-events:auto}
li.row:has(.edit) .tools{display:none}
body.cool .tools{pointer-events:none!important}   /* 도구를 누른 직후 0.5초 — 줄이 밀려 다른 단추가 손 밑에 와도 두 번 눌리지 않게 */
.tools button{font-size:11.5px;color:var(--d70);padding:2px 5px;border-radius:5px;white-space:nowrap}
.tools button:hover{background:var(--hov);color:var(--ink)}
/* 도구 — 마우스를 올리면 자주 쓰는 것만(q), 줄 끝 ⋯를 누르면 전부 줄 아래에(규칙 3 — 숨기지 않는다, 09-26) */
li.row:not(.tools-on) .tools > :not(.q){display:none}
.meta .more{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;color:var(--d70);font-size:14px;letter-spacing:1px;border-radius:5px}
.meta .more:hover,li.row.tools-on .meta .more{background:var(--hov);color:var(--ink)}
li.row.tools-on .tools{position:static;transform:none;opacity:1;pointer-events:auto;display:flex;flex-wrap:wrap;gap:5px;order:9;flex-basis:100%;
  justify-content:flex-end;padding:6px 0 2px;background:none;box-shadow:none}
li.row.tools-on .meta{flex-basis:100%;flex-wrap:wrap;justify-content:flex-end}
li.row.tools-on .tools button,li.row.tools-on .tools .rep button{padding:4px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--card);color:var(--ink)}
.tools .rep{position:relative;display:inline-flex}
.tools .rep select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.tools .rep:hover button{background:var(--hov);color:var(--ink)}
.edit{width:100%;font-size:14px;background:var(--hov);border-radius:4px;padding:0 2px;margin:0 -2px}
.edit.big{font-size:19px;font-weight:700;width:auto;min-width:240px}
.box > .edit{display:block;margin:4px 0 8px;padding:3px 4px}
.empty{color:var(--d32);font-size:13px;padding:7px 0 11px}
.first{border-top:1px solid var(--line);padding:11px 0 4px;font-size:13px;color:var(--d70);line-height:1.6}
.first p{margin:0 0 10px}
.first .ex{background:var(--hov);border-radius:8px;padding:7px 10px 1px;margin:0 0 10px}
.first .exl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;margin:0 0 5px}
.fstart{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 8px}
.fstart span{font-size:12px;color:var(--d70);margin-right:2px}
.fstart button{font-size:13px;color:var(--c4);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px}
.fstart button:hover{background:var(--hov)}
/* 메모 — 줄 아래에 펼친다. 적는 대로 저장한다 */
.meta .nm-mark{cursor:pointer}
/* 하위 할 일 — 줄 아래로 펼친다. 한 겹만 */
.subs{flex-basis:100%;display:flex;flex-direction:column;padding:2px 0 2px 23px}
.sub{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:13px;line-height:1.45}
.sub .ck{width:13px;height:13px;margin-top:0;flex:none;cursor:pointer}
.sub .stx{flex:1;min-width:0;cursor:text;overflow-wrap:anywhere}
.sub.done .stx{color:var(--d70);text-decoration:line-through}
.sub .sx{opacity:0;color:var(--d70);font-size:14px;line-height:1;padding:0 4px;flex:none}
.sub:hover .sx,.sub:focus-within .sx{opacity:1}
@media (hover:none){.sub .sx{opacity:1}}
.subs .sadd{font-size:12.5px;padding:3px 0;text-align:left;align-self:flex-start}
.subs .edit{font-size:13px;margin:2px 0}
.meta .nm-mark:hover{color:var(--ink)}
.memo{flex-basis:100%;padding:4px 0 2px 23px}
.memo textarea{display:block;width:100%;min-height:44px;resize:vertical;font:inherit;font-size:13px;line-height:1.5;
  color:var(--ink);background:var(--hov);border:0;outline:0;border-radius:6px;padding:6px 8px}
.memo textarea::placeholder{color:var(--d32)}
.addrow,.fold{display:block;width:100%;text-align:left;font-size:13px;padding:6px 0 8px}
.addrow{color:var(--d70)}
.addrow:hover{color:var(--ink)}
.fold{color:var(--d70);font-size:12px;border-top:1px solid var(--line)}
.fold:hover{color:var(--ink)}
.carry{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);
  padding:7px 12px;margin-bottom:10px;font-size:13px;color:var(--d70);box-shadow:0 1px 2px rgba(40,38,35,.04)}
.carry button{color:var(--c4);font-size:12.5px}
.carry{flex-wrap:wrap}
.carry .soon{order:9;flex-basis:100%;font-size:12px;margin-top:-4px}   /* 보관 예고는 둘째 줄 */
.carry button:hover{text-decoration:underline}
.gact{display:flex;gap:8px;margin-top:2px}
.gact button{font-size:12.5px;color:var(--d70);border:1px solid var(--line);background:var(--card);
  padding:5px 11px;border-radius:7px}
.gact button:hover{color:var(--ink)}
/* 기록 — 날마다 한 줄, 누르면 그날 끝낸 것이 펼쳐진다. 막대는 그리지 않는다 (많이 한 날이 길어 보이면 안 된다) */
.lday{border-top:1px solid var(--line)}
.lday:first-child{border-top:0}
.logday{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 0;font-size:13.5px}
.logday .n{color:var(--d70);font-size:12.5px}
.logday .car{margin-left:auto;color:var(--d70);font-size:12px}
.logday:hover .car{color:var(--ink)}
.lday ul{padding:0 0 6px 4px}
.log li.done .tx{text-decoration:none;color:var(--ink)}
.ltime{display:flex;gap:14px;font-size:12px;color:var(--d70);margin:-2px 0 5px}
.ltime span{display:inline-flex;align-items:center;gap:5px}
.k{width:7px;height:7px;border-radius:2px;display:inline-block}
.k.on,.split i{background:var(--c4)}
.k.off,.split b{background:var(--off)}
.split{display:flex;height:5px;border-radius:999px;overflow:hidden;margin:0 0 9px}
.dsum.wait .split{background:var(--line)}
.dsum.wait .wnote{font-size:12px;color:var(--d70);margin:0 0 2px}
.lsub{font-size:11.5px;color:var(--d70);padding:4px 0 0 4px}
.ltime .lplan{color:var(--d70)}
/* 한 주 */
.whero{display:flex;flex-wrap:wrap;gap:6px 32px;margin:2px 0 8px}          /* 정한 곳 / 그 밖을 큰 숫자로 — 우리 차이가 이 화면의 주인공(09-26 채점 1판) */
.whero span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--d70)}
.whero b{display:block;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.split.big{height:10px;margin:0 0 12px}
@media(max-width:640px){ .whero{gap:6px 22px} .whero b{font-size:25px} }
.wlist{padding:0 0 6px}
.wg{padding:7px 0;border-top:1px solid var(--line)}
.wg:first-child{border-top:0}
.wh{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.wh[data-list]{cursor:pointer}
.wh[data-list]:hover{text-decoration:underline}
.wh .n{margin-left:auto;font-size:12px;color:var(--d70);font-weight:400}
.wl{font-size:12.5px;color:var(--d70);padding:3px 0 0 14px;line-height:1.55}
.opn{font-size:12px;color:var(--d70);padding:0 0 8px}
.rv{display:block;padding:4px 0 8px}
.rv span{display:block;font-size:12px;color:var(--d70);margin-bottom:4px}
.rv textarea{display:block;width:100%;min-height:44px;resize:vertical;font:inherit;font-size:13.5px;line-height:1.5;
  color:var(--ink);background:var(--hov);border:0;outline:0;border-radius:6px;padding:7px 9px}
.rv textarea::placeholder{color:var(--d32)}
.memo-box textarea{display:block;width:100%;min-height:44px;resize:vertical;font:inherit;font-size:13.5px;line-height:1.55;
  color:var(--ink);background:var(--hov);border:0;outline:0;border-radius:6px;padding:7px 9px;margin:0 0 10px}
.memo-box textarea::placeholder{color:var(--d32)}
.memoadd{padding:2px 4px 10px}
.cmk{margin-left:auto;font-size:10px;color:var(--d70);flex:none}
.mlist{list-style:none;margin:0;padding:0 0 6px}
.mhit{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.mlist li:first-child .mhit{border-top:0}
.mhit .mt{flex:none;font-weight:700}
.mhit .msnip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--d70);font-size:12.5px}
.carry.wnext{color:var(--ink)}
.read p{margin:2px 0 6px;font-size:13.5px;line-height:1.6}
.read .rnote{font-size:11px;color:var(--d70);padding:0 0 8px}
/* 달력 — 칸마다 할 일 세 줄까지, 넘치면 +N. 날짜를 누르면 그날 화면 */
.wrap.wide{max-width:1040px}
.cal{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(40,38,35,.04);overflow:hidden}
.cw{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;color:var(--d70);border-bottom:1px solid var(--line)}
.cw span{padding:6px 8px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(96px,auto)}
.cc{display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;padding:5px 6px 6px;min-width:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cc:nth-child(7n){border-right:0}
.cc:hover{background:var(--hov)}
.cc.out{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.cn{font-size:12px;font-weight:600;color:var(--d70);align-self:flex-start;min-width:20px;text-align:center;border-radius:999px;padding:0 5px}
.chd{display:flex;align-items:center;gap:4px;min-width:0}
.chd .cn{flex:none;white-space:nowrap}
.hn{font-size:11px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hn.jl{color:var(--d70)}
/* 지난 날 칸의 못 한 일은 목표 색을 빼고 회색으로 — 끝낸 일은 선명하게(끝낸 기쁨, 규칙 7). 흐리게(opacity) 하면 글자 대비가 4.5 밑으로 간다(10판) */
.cc.past .cl.g:not(.done){background:color-mix(in srgb,var(--ink) 5%,var(--card));color:var(--d70)}
.cc.past .cl.n:not(.done),.cc.past .cl:not(.g):not(.n):not(.done){color:var(--d70)}
.cc.past .cl.span{background:color-mix(in srgb,var(--sc) 10%,var(--card));color:var(--d70)}
.wc.past .wcard .wt,.wc.past .wcard .ct,.wc.past .wdue{color:var(--d70)}
.cw span:last-child,.cc.red .cn{color:var(--red)}
.cc.out .cn,.cc.out .hn{font-weight:400}
.cc.tdy .cn{background:var(--ink);color:var(--card)}
.cl{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cl .gdot{width:6px;height:6px}

<script>
/* ══════════════ 자료 층 ══════════════
   화면을 전혀 모른다. 여기만 들고 가면 앱판으로 옮길 수 있다.
   모양은 `자료.md` 를 따른다. 바꿀 때 거기도 같이 고친다.          */
const DB = (() => {
  const KEY = 'oceanhour';
  const V = 1;                                  // 이 앱이 읽을 줄 아는 자료 판
  const NEWER = '더 새 판 오션아워가 만든 자료라 이 판에서는 열 수 없습니다';
  const COLORS = ['#A8415A','#8E6524','#3B6846','#2C5B88','#6B6762','#2A7B7B','#6B4E9B','#B85C2E'];   // 09-26 다섯 → 여덟(규칙 12 — 잘 되는 앱은 목표 색을 여러 가지로 쓴다)
  let S = { v:V, lists:[], todos:[], reviews:{}, days:{}, opens:{} };
  let blocked = null;                           // 저장을 멈춘 까닭. null 이면 저장한다
  let raw = null;                               // 마지막으로 읽거나 쓴 저장 글자 — 다른 탭이 그새 썼는지 본다

  const uid  = () => (crypto.randomUUID ? crypto.randomUUID()
                     : Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  const now  = () => new Date().toISOString();
  const ymd  = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                                  +'-'+String(d.getDate()).padStart(2,'0');
  const today = () => ymd(new Date());
  const shift = (day, n) => { const d = new Date(day+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
  const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const str   = (s, d = '') => s == null ? d : String(s);
  const stamp = x => ({ updatedAt: x.updatedAt ? str(x.updatedAt) : null, deletedAt: x.deletedAt ? str(x.deletedAt) : null });
  const cleanSpent = o => { const r = {};      // 날짜마다 쓴 초 {"2026-09-23": 1520}
    if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) if (isDay(k) && +v > 0) r[k] = Math.round(+v);
    return r; };
  const cleanSegs = a => {                     // ▶로 잰 구간 [시작, 끝] (초) — 시간표에 잡은 칸과 나란히 보인다(채점 11판 K2). 늦은 것 200개까지
    if (!Array.isArray(a)) return undefined;
    const r = a.filter(x => Array.isArray(x) && Number.isInteger(x[0]) && Number.isInteger(x[1]) && x[1] > x[0] && x[0] > 1e9).map(x => [x[0], x[1]]);
    return r.length ? r.sort((x, y) => x[0] - y[0]).slice(-200) : undefined; };
  const cleanRep = r => { const x = cleanRule(r); return x && r.paused ? { ...x, paused:true } : x; };   // 잠시 멈춤 — 끝내도 다음 것을 안 만든다
  const cleanRule = r => {                      // 반복 규칙 — 매일 · 평일 · 며칠마다 · 매주(격주) 그 요일 · 매달 그 날 · 매년 그 날. 모르는 모양은 「반복 안 함」
    if (!r || typeof r !== 'object') return null;
    if (r.every === 'day' || r.every === 'weekday') return { every:r.every };
    if (r.every === 'days' && +r.n >= 2 && +r.n <= 365) return { every:'days', n:+r.n };
    if (r.every === 'week' && +r.dow >= 0 && +r.dow <= 6)
      return +r.n >= 2 && +r.n <= 12 ? { every:'week', dow:+r.dow, n:+r.n } : { every:'week', dow:+r.dow };
    if (r.every === 'month' && +r.dom >= 1 && +r.dom <= 31) return { every:'month', dom:+r.dom };
    if (r.every === 'year' && +r.mon >= 1 && +r.mon <= 12 && +r.dom >= 1 && +r.dom <= 31) return { every:'year', mon:+r.mon, dom:+r.dom };
    if (r.every === 'times' && +r.n >= 1 && +r.n <= 7)          // 주 N회 — 요일은 안 정한다. wk · got = 그 주(월요일)에 앞서 몇 번 했나
      return isDay(r.wk) ? { every:'times', n:+r.n, wk:r.wk, got:Math.max(0, Math.min(7, Math.round(+r.got) || 0)) } : { every:'times', n:+r.n };
    return null; };

  /* 파일에서 오든 저장소에서 오든, 들어오는 자료는 여기를 거친다.
     아는 칸은 모양을 맞추고 모르는 칸은 그대로 둔다 (자료.md — 칸은 더하기만 한다). */
  function clean(d){
    if (!d || !Array.isArray(d.todos) || !Array.isArray(d.lists)) return { bad:'모양' };
    if (typeof d.v === 'number' && d.v > V) return { bad:'판' };
    const lists = d.lists.filter(l => l && typeof l === 'object').map((l, i) => ({ ...l,
      id: str(l.id) || uid(), name: str(l.name, '이름 없음'),
      color: /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : COLORS[i % COLORS.length],
      due: isDay(l.due) ? l.due : null,
      stages: (Array.isArray(l.stages) ? l.stages : []).filter(s => s && typeof s === 'object')
                .map(s => ({ ...s, id: str(s.id) || uid(), name: str(s.name), done: !!s.done, ...stamp(s) })),
      cur: l.cur ? str(l.cur) : null, done: !!l.done, doneAt: isDay(l.doneAt) ? l.doneAt : null,
      note: typeof l.note === 'string' ? l.note.slice(0, 5000) : '',   // 목표 메모 — 왜 · 어떻게 · 참고할 것(09-26)
      area: l.area ? (str(l.area).trim().slice(0, 30) || null) : null,   // 삶의 영역 — 글자 하나. 같은 글자면 같은 영역
      unlinked: Array.isArray(l.unlinked) ? l.unlinked.map(x => str(x)).filter(Boolean) : null,   // 지울 때 떼어 낸 할 일 — 휴지통에서 되살리면 다시 붙인다
      ...stamp(l) }));
    const has = new Set(lists.filter(l => !l.deletedAt).map(l => l.id));
    const todos = d.todos.filter(t => t && typeof t === 'object').map((t, i) => ({ ...t,
      pos: typeof t.pos === 'number' && isFinite(t.pos) ? t.pos : i,   // 순서 — 없으면 적은 차례
      id: str(t.id) || uid(), text: str(t.text), listId: has.has(str(t.listId)) ? str(t.listId) : null,
      date: isDay(t.date) ? t.date : null, done: !!t.done, doneAt: isDay(t.doneAt) ? t.doneAt : null,
      endDate: isDay(t.endDate) && isDay(t.date) && t.endDate > t.date ? t.endDate : null,   // 여러 날에 걸친 일 — 마지막 날(그날까지 포함)
      deadline: isDay(t.deadline) ? t.deadline : null,   // 할 일의 마감 — 언제 할지(date)와 따로, 언제까지
      src: t.src ? str(t.src).slice(0, 300) : null,   // 캘린더 파일에서 들여온 일정의 UID — 두 번 들여오지 않으려고
      note: str(t.note), made: isDay(t.made) ? t.made : null,
      movedFrom: isDay(t.movedFrom) ? t.movedFrom : null, movedCount: Math.max(0, +t.movedCount || 0),
      repeat: cleanRep(t.repeat), nextId: t.nextId ? str(t.nextId) : null,
      q: [1, 2, 3, 4].includes(+t.q) ? +t.q : undefined,   // 4칸 — 1 중요·급함 · 2 중요·안 급함 · 3 안 중요·급함 · 4 둘 다 아님. 적을 때 묻지 않는다(채점 11판 S17)
      spent: cleanSpent(t.spent), segs: cleanSegs(t.segs), run: typeof t.run === 'string' && !isNaN(Date.parse(t.run)) ? t.run : null,
      runEnd: t.run && typeof t.runEnd === 'string' && !isNaN(Date.parse(t.runEnd)) ? t.runEnd : null,   // 집중 — 이 시각이 되면 멈춘다
      time: /^([01]\d|2[0-3]):[0-5]\d$/.test(t.time) ? t.time : null,   // 시각 "15:00" | null
      dur: Number.isInteger(+t.dur) && +t.dur >= 15 && +t.dur <= 1440 ? +t.dur : null,   // 시간표 블록 길이(분) — 없으면 1시간
      planned: cleanSpent(t.planned),           // 시간표로 적은 시간(추정) {날짜: 초} — 잰 시간이 있으면 쓰지 않는다
      goal: Number.isInteger(+t.goal) && +t.goal >= 2 && +t.goal <= 99 ? +t.goal : null,   // 하루 N번 — 다 채우면 끝난다
      tally: cleanSpent(t.tally),               // 센 것 {날짜: 번}
      deletedBy: t.deletedBy === 'app' ? 'app' : null,   // 'app' — 사람이 안 지웠다(반복의 다음 것을 거둔 것). 휴지통에 안 보인다
      subs: (Array.isArray(t.subs) ? t.subs : []).filter(x => x && typeof x === 'object')   // 하위 할 일 — 단계와 같은 모양
              .map(x => ({ ...x, id: str(x.id) || uid(), text: str(x.text), done: !!x.done, ...stamp(x) })),
      ...stamp(t) }));
    const reviews = {};                         // 주간 회고 { 월요일: {good, stuck, next, updatedAt} }
    if (d.reviews && typeof d.reviews === 'object')
      for (const [k, r] of Object.entries(d.reviews)) if (isDay(k) && r && typeof r === 'object')
        reviews[k] = { good:str(r.good), stuck:str(r.stuck), next:str(r.next), updatedAt: r.updatedAt ? str(r.updatedAt) : null };
    const days = {};                            // 저녁 마무리의 한 줄 { 날짜: {line, updatedAt} }
    if (d.days && typeof d.days === 'object')
      for (const [k, r] of Object.entries(d.days)) if (isDay(k) && r && typeof r === 'object')
        days[k] = { line:str(r.line).slice(0, 2000), updatedAt: r.updatedAt ? str(r.updatedAt) : null };
    const opens = {};                           // 연 횟수 { 날짜: 번 } — 이 기기 안에서만 센다. 밖으로 보내지 않는다
    if (d.opens && typeof d.opens === 'object')
      for (const [k, n] of Object.entries(d.opens)) if (isDay(k) && Number.isInteger(+n) && +n > 0) opens[k] = Math.min(+n, 9999);
    return { data: { ...d, v:V, lists, todos, reviews, days, opens } };
  }

  function load(){                              // 처음 열 때, 그리고 다른 탭이 저장했을 때
    let r;
    try{ r = localStorage.getItem(KEY); }
    catch(e){ blocked = blocked || '이 화면에서는 저장이 막혀 있습니다'; return S; }
    if (r === null || r === raw) return S;
    let c; try{ c = clean(JSON.parse(r)); }catch(e){ c = { bad:'모양' }; }
    if (c.bad){                                 // 못 읽는 자료를 빈 것으로 덮어쓰지 않는다 (규칙.md 1층 3번)
      blocked = (c.bad === '판' ? NEWER : '저장된 자료를 읽지 못했습니다') + ' — 지우지 않고 그대로 두었습니다';
      return S; }
    S = c.data; raw = r; probeRoom(); return S;
  }
  const fresh = () => { if (!blocked) load(); };   // 바꾸기 전에 — 다른 탭이 그새 저장했으면 그 위에서 바꾼다
  function save(){
    if (blocked) return false;
    try{ const s = JSON.stringify(S); localStorage.setItem(KEY, s); raw = s; probeRoom(); return true; }
    catch(e){ blocked = '저장하지 못했습니다(저장 공간이 모자라거나 막혔습니다)'; return false; }
  }
  const blockedWhy = () => blocked;
  /* 저장 공간 — 브라우저마다 한도가 달라서 선을 미리 긋지 않는다(09-25 이 창은 5,234만 자였다).
     자료가 100만 자(할 일 약 3,300개)를 넘으면, 25만 자 늘 때마다 지금 크기의 절반을 실제로 더 써 본다.
     안 들어가면 아직 막히기 전에 알린다 — 그때까지 적은 것은 다 저장되어 있다 */
  let room = true, roomAt = 0;
  function probeRoom(){
    if (blocked || !raw || raw.length < 1e6 || Math.abs(raw.length - roomAt) < 25e4) return;
    roomAt = raw.length;
    try{ localStorage.setItem(KEY + '.room', 'x'.repeat(Math.floor(raw.length / 2))); room = true; }
    catch(e){ room = false; }
    try{ localStorage.removeItem(KEY + '.room'); }catch(e){}
  }
  const roomTight = () => !room;

  const live      = a => a.filter(x => !x.deletedAt);
  const lists     = () => live(S.lists);
  const listOf    = id => S.lists.find(l => l.id === id) || null;
  const todo      = id => S.todos.find(t => t.id === id) || null;
  const todos     = () => live(S.todos);
  const spanLen   = t => t.endDate && t.date ? Math.round((Date.parse(t.endDate) - Date.parse(t.date)) / 864e5) : 0;
  const reSpan    = (t, len) => { t.endDate = len > 0 && t.date ? shift(t.date, len) : null; };   // 날을 옮겨도 기간 길이는 그대로
  const lastDay   = t => t.endDate || t.date;
  const todosOn   = day => todos().filter(t => t.date === day || (t.endDate && t.date < day && day <= t.endDate));
  const undated   = () => todos().filter(t => !t.date);
  const ARCH = 30;                              // 이만큼 넘게 밀리면 보관함으로 — 자료는 안 옮기고 그때그때 센다
  const archived  = t => !t.done && !!t.date && lastDay(t) < shift(today(), -ARCH);
  const archive   = () => todos().filter(archived).sort((a, b) => b.date.localeCompare(a.date));
  const past      = () => todos().filter(t => !t.done && t.date && lastDay(t) < today() && !archived(t))   // 지난 날에 두고 안 끝낸 것 (보관함 것은 빼고)
                           .sort((a, b) => a.date.localeCompare(b.date));
  const search    = q => { q = q.trim().toLowerCase(); if (!q) return [];
                           return todos().filter(t => (t.text + '\n' + t.note + '\n' + subsOf(t).map(x => x.text).join('\n')).toLowerCase().includes(q))   // 메모 · 하위 할 일 속 낱말도
                             .reverse().sort((a, b) => (b.date||'').localeCompare(a.date||'')); };  // 최근 날짜부터

  /* ── 분류 · 목표 ── 목표는 새 것이 아니라 분류에 칸(due·stages·cur·done·doneAt)이 붙은 것이다 (자료.md) */
  function addList(name){
    name = (name||'').trim(); if (!name) return null;
    fresh();
    const l = { id:uid(), name, color:COLORS[S.lists.length % COLORS.length],
                due:null, stages:[], cur:null, done:false, doneAt:null, area:null, unlinked:null, note:'',
                updatedAt:now(), deletedAt:null };
    S.lists.push(l); save(); return l;
  }
  function editList(id, patch){
    fresh();
    const l = listOf(id); if (!l) return null;
    Object.assign(l, patch, { updatedAt:now() }); save(); return l;
  }
  const areas = () => [...new Set(lists().map(l => l.area).filter(Boolean))];   // 처음 나온 차례
  function renameArea(old, nw){                 // 영역 이름 고치기 — 그 영역의 목표를 한꺼번에. 비우면 영역 없음
    fresh(); nw = (nw || '').trim().slice(0, 30) || null;
    S.lists.forEach(l => { if (l.area === old){ l.area = nw; l.updatedAt = now(); } }); save();
  }
  const finishList = id => editList(id, { done:true, doneAt:today() });
  const reopenList = id => editList(id, { done:false, doneAt:null });
  function removeList(id){                      // 분류만 지운다. 할 일은 남고, 어느 할 일이 떨어졌는지 돌려준다
    fresh();
    const l = listOf(id); if (!l) return [];
    const ids = [];
    l.deletedAt = now(); l.updatedAt = now();
    S.todos.forEach(t => { if (t.listId === id){ t.listId = null; t.updatedAt = now(); ids.push(t.id); } });
    l.unlinked = ids;                           // 휴지통에서 되살릴 때 다시 붙이려고
    save(); return ids;
  }
  function restoreList(id, ids){                // ids 가 없으면(휴지통에서) 지울 때 떼어 낸 것을 다시 붙인다
    fresh();
    const l = listOf(id); if (!l) return;
    l.deletedAt = null; l.updatedAt = now();
    (ids || l.unlinked || []).forEach(x => { const t = todo(x); if (t && !t.listId){ t.listId = id; t.updatedAt = now(); } });
    l.unlinked = null;
    save();
  }


  /* ── 하위 할 일 ── 할 일 안의 작은 목록. 한 겹만. 다 끝내도 위 할 일은 스스로 안 끝난다 — 끝내는 건 사람이 한다 */
  const subsOf = t => live(t.subs || []);
  const subOf  = (tid, sid) => { const t = todo(tid); return t && (t.subs || []).find(x => x.id === sid) || null; };
  function addSub(tid, text){
    text = (text || '').trim(); if (!text) return null;
    fresh();
    const t = todo(tid); if (!t) return null;
    const x = { id:uid(), text, done:false, updatedAt:now(), deletedAt:null };
    (t.subs = t.subs || []).push(x); t.updatedAt = now(); save(); return x;
  }
  function editSub(tid, sid, patch){
    fresh();
    const t = todo(tid), x = subOf(tid, sid); if (!x) return null;
    Object.assign(x, patch, { updatedAt:now() }); t.updatedAt = now(); save(); return x;
  }
  const toggleSub  = (tid, sid) => { const x = subOf(tid, sid); return x ? editSub(tid, sid, { done:!x.done }) : null; };
  const removeSub  = (tid, sid) => editSub(tid, sid, { deletedAt:now() });
  const restoreSub = (tid, sid) => editSub(tid, sid, { deletedAt:null });

  /* ── 단계 ── 지금 단계는 cur 가 가리키고, 없거나 끝났으면 안 끝난 첫 단계다 */
  const stagesOf = l => live(l.stages || []);
  const nowStage = l => { const ss = stagesOf(l);
    return ss.find(s => s.id === l.cur && !s.done) || ss.find(s => !s.done) || null; };
  const stageOf  = (l, sid) => (l && l.stages || []).find(s => s.id === sid) || null;
  function addStage(lid, name){
    name = (name||'').trim(); if (!name) return null;
    fresh();
    const l = listOf(lid); if (!l) return null;
    const s = { id:uid(), name, done:false, updatedAt:now(), deletedAt:null };
    (l.stages = l.stages || []).push(s); l.updatedAt = now(); save(); return s;
  }
